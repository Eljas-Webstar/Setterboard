/* Eine Kachel pro Kalender, klein und antippbar */
function kachel(name, unten, eigen){
  return '<button class="kalkachel'+(eigen?" eigen":"")+'" data-kal="'+esc(name)+'">'+
    '<span class="avatar">'+esc(initials(name))+'</span>'+
    '<span class="kk-text"><b>'+esc(name)+'</b><small>'+esc(unten||"")+'</small></span>'+
  '</button>';
}

function kalenderSuchfeld(anzahl){
  if(anzahl<4) return "";
  return '<div class="kalsuche"><input id="kalSuche" type="search" placeholder="Closer suchen" '+
    'value="'+esc(S.closerSuche||"")+'" autocomplete="off" spellcheck="false"></div>';
}
function bindeKalenderSuche(){
  var f=$("kalSuche"); if(!f) return;
  f.oninput=function(){ S.closerSuche=f.value; renderHome(); var n=$("kalSuche"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } };
}

function renderHome(){
  var von=ymd(S.weekStart), bis=ymd(addDays(S.weekStart,6));
  var heute=ymd(new Date()), c=meinCloser();
  var meine=erlaubteTermine().filter(function(a){ return a.setter===S.me.name&&a.status==="geplant"&&a.datum>=heute; }).length;
  var istCloser=S.me.rolle==="closer";

  if(istAdmin()) return renderHomeAdmin();
  var html='<div class="hallo"><h2>Hallo '+esc(S.me.name)+'</h2><p>'+
    (istCloser
      ? 'Dein Kalender. Termin antippen, um das Ergebnis zu setzen.'
      : 'Du trägst im Kalender von '+esc(c||"deinem Closer")+' ein.'+(meine?' '+meine+' deiner Termine stehen noch offen.':''))+
    '</p></div>';

  if(!c){
    html+='<div class="kal-karte" style="cursor:default"><div class="kopf"><b>Kein Kalender zugeordnet</b></div>'+
      '<div class="naechster">Dein Closer muss dir einen Zugang geben. Melde dich bei ihm.</div></div>';
  } else {
    var woche=erlaubteTermine().filter(function(a){ return a.datum>=von&&a.datum<=bis&&a.status!=="abgesagt"; });
    var offen=woche.filter(function(a){ return a.status==="geplant"; }).length;
    var naechst=erlaubteTermine().filter(function(a){ return a.status==="geplant"&&a.datum>=heute; })
      .sort(function(a,b){ return startMs(a)-startMs(b); })[0];
    html+='<div class="kalreihe">'+
      kachel(c, woche.length+(woche.length===1?" Termin diese Woche":" Termine diese Woche")+
                (offen?" · "+offen+" offen":""), istCloser)+'</div>';
    html+='<div class="naechstzeile">'+(naechst
      ? '<b>Als Nächstes</b> '+esc(name(naechst))+' in '+esc(ortText(naechst))+', '+
        esc(deDate(parseYmd(naechst.datum)))+' um '+esc(naechst.zeit)
      : 'Kein Termin geplant')+'</div>';
  }

  html+='<div class="wege">'+
    '<button class="weg" data-go="kalender">Kalender<small>Tag, Woche und Monat</small></button>'+
    (istCloser?'':'<button class="weg" data-go="meine">Meine Termine<small>Nur was du selbst gesetzt hast</small></button>')+
  '</div>';

  $("view-home").innerHTML=html;
  Array.prototype.forEach.call($("view-home").querySelectorAll("[data-kal]"),function(b){
    b.onclick=function(){ S.view="week"; renderFilter(); render(); };
  });
  Array.prototype.forEach.call($("view-home").querySelectorAll("[data-go]"),function(b){
    b.onclick=function(){
      var z=b.dataset.go;
      S.filterCloser=(z==="meine"?"meine":"alle");
      S.view="week"; renderFilter(); render();
    };
  });
}

/* Tag, Woche oder Monat. Die Wahl bleibt auf dem Geraet gespeichert. */
function modus(){
  if(!S.kalModus){
    var g=null;
    try{ g=localStorage.getItem("sb_kalmodus"); }catch(e){}
    S.kalModus = (g==="tag"||g==="woche"||g==="monat") ? g
      : (window.matchMedia("(max-width:899px)").matches ? "tag" : "woche");
  }
  return S.kalModus;
}
function setModus(m){
  S.kalModus=m;
  try{ localStorage.setItem("sb_kalmodus",m); }catch(e){}
  render();
}
function monatsAnker(){ var d=parseYmd(S.tag); return new Date(d.getFullYear(),d.getMonth(),1); }
var MONATE=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function renderWeek(){
  var start=S.weekStart, m=modus();
  var heuteYmd=ymd(new Date());
  // Umschalter und Beschriftung der Leiste
  Array.prototype.forEach.call($("modusBar").querySelectorAll("button"),function(b){
    b.setAttribute("aria-pressed",String(b.dataset.m===m));
  });
  var tagD=parseYmd(S.tag);
  var eng=window.matchMedia("(max-width:899px)").matches;
  if(m==="tag"){
    $("weekTitle").textContent=(eng?DOW_S[(tagD.getDay()+6)%7]:DOW[(tagD.getDay()+6)%7])+", "+deDate(tagD);
    $("weekRange").textContent="";
  } else if(m==="monat"){
    var ma=monatsAnker();
    $("weekTitle").textContent=MONATE[ma.getMonth()]+" "+ma.getFullYear();
    $("weekRange").textContent="";
  } else {
    $("weekTitle").textContent="KW "+isoWeek(start);
    $("weekRange").textContent=deDate(start)+" bis "+deDate(addDays(start,5));
  }
  $("weekStart").textContent="";
  var amHeute = (m==="tag") ? (S.tag===heuteYmd)
    : (m==="woche") ? (ymd(S.weekStart)<=heuteYmd && heuteYmd<=ymd(addDays(S.weekStart,6)))
    : (monatsAnker().getMonth()===new Date().getMonth() && monatsAnker().getFullYear()===new Date().getFullYear());
  var hb=$("heuteBtn");
  hb.hidden=false;
  hb.classList.toggle("ruht",!!amHeute);       // steht man schon auf heute, tritt er zurück
  hb.title = amHeute ? "Du bist beim heutigen Tag" : "Zurück zum heutigen Tag";
  $("sperrBtn").hidden = !(S.me && (S.me.rolle==="closer" || istAdmin()));
  var today=heuteYmd, list=visible(), html="";
  for(var i=0;i<6;i++){
    var d=addDays(start,i), key=ymd(d);
    var day=list.filter(function(a){ return a.datum===key; });
    html+='<div class="day'+(key===today?" today":"")+(day.length?"":" empty-mobile")+'">'+
      '<div class="day-head"><span class="dow">'+DOW_S[i]+'</span><span class="dnum mono">'+pad(d.getDate())+"."+pad(d.getMonth()+1)+'</span></div>'+
      (day.length?'<div class="day-body">'+(function(){ var an=anfahrten(day); return day.map(function(x){ return cardHtml(x,an[x.id]); }).join(""); })()+'</div>':'<div class="day-empty">frei</div>')+
    '</div>';
  }
  $("weekGrid").innerHTML=html;
  var leer=!list.length;
  var hinweis=$("leerHinweis");
  if(!hinweis){
    hinweis=document.createElement("div");
    hinweis.id="leerHinweis";
    hinweis.className="banner";
    hinweis.style.marginBottom="12px";
    var wrap=document.querySelector(".weekmain");
    if(wrap) wrap.insertBefore(hinweis,wrap.firstChild);
  }
  if(leer){
    var gefiltert=S.filterCloser!=="alle";
    var wer=S.filterCloser==="meine"?"Nur deine Termine":S.filterCloser;
    hinweis.hidden=false;
    hinweis.innerHTML='<span>📭</span><div>'+
      (gefiltert
        ? '<b>'+esc(wer)+'</b> hat hier keine Termine. '+
          '<button class="btn ghost" id="alleZeigen" style="padding:2px 8px">Alle anzeigen</button>'
        : '<b>Noch keine Termine.</b> Über <b>Termin setzen</b> trägst du den ersten ein.')+
      '</div>';
    var az=$("alleZeigen");
    if(az) az.onclick=function(){ S.filterCloser="alle"; renderFilter(); render(); };
  } else hinweis.hidden=true;
  Array.prototype.forEach.call($("weekGrid").querySelectorAll(".card"),function(b){
    b.onclick=function(){ openAppt(b.dataset.id); };
  });
  var cal=$("calGrid");
  if(cal) cal.className="cal"+(m==="woche"?" wochenmodus":"");
  if(m==="tag") renderTagRaster();
  else if(m==="monat") renderMonat(list,today);
  else renderRaster(start,list,today);
}

/* Zeitraster: Achse links, Termine an ihrer Uhrzeit */
function renderTagRaster(){
  var box=$("calGrid"); if(!box) return;
  var d=parseYmd(S.tag), heute=ymd(new Date());
  var liste=visible().filter(function(a){ return a.datum===S.tag; })
    .sort(function(a,b){ return startMs(a)-startMs(b); });
  var anf=anfahrten(liste);
  var VON=RULES.openHour-1, BIS=RULES.closeHour+2, H=64, hoehe=(BIS-VON)*H;

  var kopf='<div class="tagkopf">'+
    '<button class="tagnav" id="tagZurueck">‹</button>'+
    '<div class="tagtitel"><b>'+DOW[(d.getDay()+6)%7]+'</b><span>'+deDate(d)+(S.tag===heute?" · heute":"")+'</span></div>'+
    '<button class="tagnav" id="tagVor">›</button>'+
  '</div>';

  var achse='<div class="axis" style="height:'+hoehe+'px">';
  for(var h=VON;h<=BIS;h++){
    achse+='<div class="tick '+((h%2===0)?"major":"minor")+'" style="top:'+((h-VON)*H+3)+'px">'+pad(h)+'<span style="opacity:.55">:00</span></div>';
  }
  achse+='</div>';

  var inhalt="";
  liste.forEach(function(a){
    if(a.status==="abgesagt") return;
    var f=anf[a.id];
    var von=zeitInMin(a.zeit), dauer=(+a.dauer||60);
    if(f!=null&&f>=6){
      var topF=(von-f-VON*60)/60*H, hF=f/60*H;
      if(topF<0){ hF+=topF; topF=0; }
      if(hF>=6) inhalt+='<div class="fahrt" style="top:'+topF+'px;height:'+hF+'px"><span>'+esc(minText(f))+'</span></div>';
    }
    var top=(von-VON*60)/60*H, hh=Math.max(30,dauer/60*H-3);
    var st=STATUS[a.status]||STATUS.geplant;
    inhalt+='<button class="tblock gross st-'+esc(a.status)+'" data-id="'+esc(a.id)+'" '+
      'style="top:'+top+'px;height:'+hh+'px;left:3px;right:3px;--st:'+st.color+'">'+
      '<span class="stapel">'+
        '<span class="z">'+esc(a.zeit)+' bis '+esc(endeVon(a))+'</span>'+
        '<span class="n gross">'+esc(name(a))+'</span>'+
        (a.ort?'<span class="ort">'+esc(a.ort)+'</span>':'')+
        (hh>92?'<span class="u">'+esc(nebenInfo(a,f))+'</span>':'')+
      '</span></button>';
  });
  if(S.tag===heute){
    var n=new Date(), min=n.getHours()*60+n.getMinutes();
    if(min>=VON*60&&min<=BIS*60) inhalt+='<div class="jetzt" style="top:'+((min-VON*60)/60*H)+'px"></div>';
  }

  box.innerHTML=kopf+'<div class="calbody tagbody">'+achse+
    '<div class="daycol" style="height:'+hoehe+'px">'+inhalt+'</div></div>';
  $("tagZurueck").onclick=function(){ S.tag=ymd(addDays(parseYmd(S.tag),-1)); S.weekStart=mondayOf(parseYmd(S.tag)); render(); };
  $("tagVor").onclick=function(){ S.tag=ymd(addDays(parseYmd(S.tag),1)); S.weekStart=mondayOf(parseYmd(S.tag)); render(); };
  Array.prototype.forEach.call(box.querySelectorAll(".tblock"),function(b){
    b.onclick=function(){ openAppt(b.dataset.id); };
  });
}

function tagesFahrtMinuten(liste){
  if(!liste.length) return null;
  var summe=0, ok=false, vor=null;
  liste.forEach(function(a){
    var f = vor ? fahrMin(vor.plz,vor.ort,a.plz,a.ort) : fahrVonStart(a.closer,a.plz,a.ort);
    if(f!=null){ summe+=f; ok=true; }
    vor=a;
  });
  var zurueck=vor?fahrVonStart(vor.closer,vor.plz,vor.ort):null;
  if(zurueck!=null) summe+=zurueck;
  return ok?summe:null;
}

/* Monat: Gitter mit allen Tagen, Tippen springt in den Tag */
function renderMonat(list,today){
  var box=$("calGrid"); if(!box) return;
  var erster=monatsAnker(), monat=erster.getMonth();
  var start=mondayOf(erster);
  var breit=window.matchMedia("(min-width:620px)").matches;
  var maxZeilen=breit?3:0;               // auf dem Handy nur Punkte, sonst Zeilen
  var cName=meinCloser();

  var kopf='<div class="monkopf">'+["Mo","Di","Mi","Do","Fr","Sa","So"].map(function(t,i){
    return '<div'+(i>4?' class="we"':'')+'>'+t+'</div>'; }).join("")+'</div>';

  var zellen="", d=new Date(start);
  for(var i=0;i<42;i++){
    var key=ymd(d);
    var tagL=list.filter(function(a){ return a.datum===key&&a.status!=="abgesagt"; })
                 .sort(function(a,b){ return startMs(a)-startMs(b); });
    var sp=cName?gesperrt(key,cName):null;
    var inhalt="";
    if(maxZeilen){
      inhalt=tagL.slice(0,maxZeilen).map(function(a){
        var st=STATUS[a.status]||STATUS.geplant;
        return '<span class="mzeile st-'+esc(a.status)+'" style="--st:'+st.color+'">'+
          '<b>'+esc(a.zeit)+'</b><span>'+esc(name(a))+'</span></span>';
      }).join("");
      if(tagL.length>maxZeilen) inhalt+='<span class="mmehr">+'+(tagL.length-maxZeilen)+' weitere</span>';
      var tf=tagesFahrtMinuten(tagL);
      if(tf!=null) inhalt+='<span class="mfahrt">🚗 '+esc(minText(tf))+'</span>';
    } else if(tagL.length){
      inhalt='<span class="mpunkte">'+tagL.slice(0,6).map(function(a){
        var st=STATUS[a.status]||STATUS.geplant;
        return '<i style="--st:'+st.color+'"></i>'; }).join("")+'</span>';
    }
    var wochenende=(d.getDay()===0||d.getDay()===6);
    zellen+='<button class="montag'+(d.getMonth()!==monat?" fremd":"")+(key===today?" heute":"")+
      (sp?" gesperrt":"")+(wochenende?" we":"")+'" '+
      'data-tag="'+key+'"'+(sp?' title="'+esc(sp.grund||"nicht da")+'"':'')+'>'+
      '<span class="mzahl">'+d.getDate()+'</span>'+inhalt+'</button>';
    d=addDays(d,1);
    if(i>=34&&d.getMonth()!==monat&&(i+1)%7===0) break;   // letzte leere Zeile weglassen
  }

  box.innerHTML=kopf+'<div class="mongrid">'+zellen+'</div>';
  Array.prototype.forEach.call(box.querySelectorAll(".montag"),function(b){
    b.onclick=function(){
      S.tag=b.dataset.tag;
      S.weekStart=mondayOf(parseYmd(S.tag));
      setModus("tag");
    };
  });
}

function renderRaster(start,list,today){
  var box=$("calGrid"); if(!box) return;
  var VON=RULES.openHour-1, BIS=RULES.closeHour+2;   // etwas Luft ober- und unterhalb
  var H=58, hoehe=(BIS-VON)*H;

  function tagesFahrt(liste){
    if(!liste.length) return null;
    var summe=0, ok=false, vor=null;
    liste.forEach(function(a){
      var f = vor ? fahrMin(vor.plz,vor.ort,a.plz,a.ort) : fahrVonStart(a.closer,a.plz,a.ort);
      if(f!=null){ summe+=f; ok=true; }
      vor=a;
    });
    var zurueck=vor?fahrVonStart(vor.closer,vor.plz,vor.ort):null;
    if(zurueck!=null) summe+=zurueck;
    return ok?summe:null;
  }

  var kopf='<div class="calhead"><div class="hc"></div>';
  for(var i=0;i<6;i++){
    var d=addDays(start,i), key=ymd(d);
    var tagL=list.filter(function(a){ return a.datum===key&&a.status!=="abgesagt"; })
                 .sort(function(a,b){ return startMs(a)-startMs(b); });
    var tf=tagesFahrt(tagL);
    kopf+='<div class="hc'+(key===today?" today":"")+'">'+
      '<span class="dow">'+DOW_S[i]+'</span><span class="dnum">'+pad(d.getDate())+"."+pad(d.getMonth()+1)+'</span>'+
      (tf!=null?'<span class="fahrt-tag" title="geschätzte Fahrzeit an dem Tag, hin und zurück">🚗 '+minText(tf)+'</span>':'')+
      '</div>';
  }
  kopf+='</div>';

  var achse='<div class="axis" style="height:'+hoehe+'px">';
  for(var h=VON;h<=BIS;h++){
    var gerade=(h%2===0);
    achse+='<div class="tick '+(gerade?"major":"minor")+'" style="top:'+((h-VON)*H+3)+'px">'+pad(h)+'<span style="opacity:.55">:00</span></div>';
  }
  achse+='</div>';

  var spalten="";
  for(var i2=0;i2<6;i2++){
    var d2=addDays(start,i2), key2=ymd(d2);
    var tag=list.filter(function(a){ return a.datum===key2; })
                .sort(function(a,b){ return startMs(a)-startMs(b); });
    var inhalt="", anf=anfahrten(tag);
    // Anfahrt als grauer Streifen vor dem Termin
    tag.forEach(function(a){
      if(a.status==="abgesagt") { return; }
      var f=anf[a.id];
      if(f==null||f<6) return;
      var von=zeitInMin(a.zeit);
      var topF=(von-f-VON*60)/60*H, hF=f/60*H;
      if(topF<0){ hF+=topF; topF=0; }
      if(hF<6) return;
      inhalt+='<div class="fahrt" style="top:'+topF+'px;height:'+hF+'px" title="Anfahrt '+esc(minText(f))+'">'+
        (hF>17?'<span>'+esc(minText(f))+'</span>':'')+'</div>';
    });
    // Ueberlappende Termine nebeneinander legen
    var spur=[], spurVon={};
    tag.forEach(function(a){
      var von=zeitInMin(a.zeit), bis=von+(+a.dauer||60), i3=0;
      while(spur[i3]!=null && spur[i3]>von) i3++;
      spur[i3]=bis; spurVon[a.id]=i3;
    });
    var spuren=Math.max(1,spur.length);
    tag.forEach(function(a){
      var von=zeitInMin(a.zeit), dauer=(+a.dauer||60);
      var top=(von-VON*60)/60*H, hh=Math.max(26,dauer/60*H-3);
      var breite=100/spuren, links=(spurVon[a.id]||0)*breite;
      var st=STATUS[a.status]||STATUS.geplant;
      var mittel=hh>=44, gross=hh>=76, sehrGross=hh>=118;
      var adr=[a.strasse,[a.plz,a.ort].filter(Boolean).join(" ")].filter(Boolean).join(", ");
      inhalt+='<button class="tblock st-'+esc(a.status)+(gross?" gross":"")+'" data-id="'+esc(a.id)+'" '+
        'style="top:'+top+'px;height:'+hh+'px;left:calc('+links+'% + 3px);width:calc('+breite+'% - 6px);--st:'+st.color+'">'+
        '<span class="stapel">'+
          (gross
            ? '<span class="z">'+esc(a.zeit)+' bis '+esc(endeVon(a))+' Uhr</span>'+
              '<span class="n gross">'+esc(name(a))+'</span>'
            : '<span class="n"><span class="z">'+esc(a.zeit)+'</span> '+esc(name(a))+'</span>')+
          (mittel&&a.ort?'<span class="ort">'+esc(a.ort)+'</span>':'')+
          (mittel?'<span class="u">'+esc(nebenInfo(a,anf[a.id]))+'</span>':'')+
          (gross&&a.strasse?'<span class="u">'+esc(a.strasse)+'</span>':'')+
          (gross&&a.telefon?'<span class="u mono">'+esc(a.telefon)+'</span>':'')+
          (gross&&a.hinweise&&a.hinweise.length?
            '<span class="tmarken">'+a.hinweise.slice(0,sehrGross?6:3).map(function(h){
              return '<span>'+esc(h)+'</span>'; }).join("")+'</span>':'')+
          (sehrGross&&a.notiz?'<span class="u tnotiz">'+esc(a.notiz)+'</span>':'')+
        '</span>'+
      '</button>';
    });
    var jetzt="";
    if(key2===today){
      var n=new Date(), min=n.getHours()*60+n.getMinutes();
      if(min>=VON*60&&min<=BIS*60) jetzt='<div class="jetzt" style="top:'+((min-VON*60)/60*H)+'px"></div>';
    }
    var spK=meinCloser()?gesperrt(key2,meinCloser()):null;
    spalten+='<div class="daycol'+(tag.length?"":" frei")+(spK?" gesperrt":"")+'" style="height:'+hoehe+'px" '+
      (spK?'title="'+esc(spK.grund||"nicht da")+'"':'')+'>'+inhalt+jetzt+
      (spK?'<div class="sperrband"><span>'+esc(spK.grund||"nicht da")+'</span></div>':'')+'</div>';
  }

  box.innerHTML='<div class="calscroll"><div class="calinner">'+kopf+
    '<div class="calbody">'+achse+spalten+'</div></div></div>';
  Array.prototype.forEach.call(box.querySelectorAll(".tblock"),function(b){
    b.onclick=function(){ openAppt(b.dataset.id); };
  });
}

function overlay(title,bodyHtml,footHtml,tag){
  document.body.style.overflow="hidden";

  $("overlays").innerHTML=
    '<button class="scrim" id="scrim" aria-label="Schließen"></button>'+
    '<aside class="panel" data-overlay="'+esc(tag||"x")+'" role="dialog" aria-modal="true">'+

    '</aside>';

  $("closeOv").onclick=closeOverlay;

  var panel=document.querySelector(".panel");
  if(panel&&window.innerWidth>700){
    var gespeichert=parseInt(LS.get("sb_panelw")||"0",10);
    if(gespeichert>300) panel.style.width=Math.min(gespeichert,window.innerWidth-60)+"px";
    var griff=document.createElement("div");
    griff.className="griff";
    griff.title="Breite ziehen, Doppelklick setzt zurück";
    griff.addEventListener("mousedown",function(e){ zugStart(e.clientX,panel,griff); e.preventDefault(); });
    griff.addEventListener("touchstart",function(e){ zugStart(e.touches[0].clientX,panel,griff); },{passive:true});
    griff.addEventListener("dblclick",function(){
      panel.style.width=""; LS.del("sb_panelw");
    });
    panel.appendChild(griff);
  }
}

/* Panel in der Breite ziehen */
var ZUG={aktiv:false,x:0,w:0,panel:null,griff:null};
function zugStart(x,panel,griff){
  ZUG.aktiv=true; ZUG.x=x; ZUG.w=panel.getBoundingClientRect().width;
  ZUG.panel=panel; ZUG.griff=griff;
  griff.classList.add("zieht");
  document.body.style.userSelect="none";
}
function zugZieh(x){
  if(!ZUG.aktiv) return;
  var w=ZUG.w+(ZUG.x-x);
  w=Math.max(330,Math.min(window.innerWidth-60,w));
  ZUG.panel.style.width=w+"px";
}
function zugEnde(){
  if(!ZUG.aktiv) return;
  ZUG.aktiv=false;
  document.body.style.userSelect="";
  if(ZUG.griff) ZUG.griff.classList.remove("zieht");
  if(ZUG.panel) LS.set("sb_panelw",String(Math.round(ZUG.panel.getBoundingClientRect().width)));
}

  function quali(){

  function zeitText(m){ return pad(Math.floor(m/60))+":"+pad(m%60); }
  function konflikt(datum,closer,von,dauer){

    S.appts.forEach(function(x){
      if(x.datum!==datum||x.closer!==closer||x.status==="abgesagt"||x.id===a.id) return;
      var xv=zeitInMin(x.zeit), xb=xv+(+x.dauer||60);
      if(von<xb&&xv<bis) treffer=x;
    });
    return treffer;
  }

  /* --- Terminvorschlaege: welcher Slot kostet die wenigste zusaetzliche Fahrt? --- */
  function tagesFahrtSortiert(liste){
    return tagesFahrtMinuten(liste.slice().sort(function(x,y){
      return zeitInMin(x.zeit)-zeitInMin(y.zeit);
    }));
  }
  function besteTermine(tage,wieViele){
    var ad=adrJetzt();
    if(!ad.plz||!plzKoord(ad.plz)) return null;              // ohne bekannte PLZ nichts behaupten
    var dauer=+$("f_dauer").value||RULES.slotMin;
    var minMs=Date.now()+RULES.leadHours*3600*1000;
    var heute=new Date(); heute.setHours(0,0,0,0);
    var kandidaten=[];

    for(var tag=0; tag<tage; tag++){
      var d=new Date(heute.getFullYear(),heute.getMonth(),heute.getDate()+tag);
      var tagYmd=ymd(d);
      if(d.getDay()===0) continue;                     // sonntags keine Hausbesuche
      if(gesperrt(tagYmd,meinC)) continue;

      var amTag=S.appts.filter(function(x){
        return x.datum===tagYmd&&x.closer===meinC&&x.status!=="abgesagt"&&x.id!==a.id;
      });
      if(amTag.length>=RULES.maxPerDay) continue;
      var basis=tagesFahrtSortiert(amTag)||0;
      var bester=null;

      for(var m=RULES.openHour*60; m+dauer<=(RULES.closeHour+1)*60; m+=30){
        var ms=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(m/60),m%60).getTime();
        if(ms<minMs) continue;                          // zu kurzfristig
        if(konflikt(tagYmd,meinC,m,dauer)) continue;    // Zeit ist belegt
        var fp=fahrtPruefung(tagYmd,meinC,m,dauer,ad.plz,ad.ort,a.id);
        if(fp.eng) continue;                            // Closer kaeme zu spaet an

        var mit=amTag.concat([{
          id:"__neu__", closer:meinC, plz:ad.plz, ort:ad.ort,
          zeit:zeitText(m), dauer:dauer, status:"geplant"
        }]);
        var gesamt=tagesFahrtSortiert(mit);
        if(gesamt==null) continue;
        var zusatz=gesamt-basis;
        if(!bester||zusatz<bester.zusatz) bester={ datum:tagYmd, zeit:zeitText(m), zusatz:zusatz, voll:amTag.length };
      }
      if(bester) kandidaten.push(bester);
    }

    kandidaten.sort(function(x,y){
      if(x.zusatz!==y.zusatz) return x.zusatz-y.zusatz; // wenig Zusatzfahrt zuerst
      return x.datum<y.datum?-1:1;                      // bei Gleichstand der fruehere Tag
    });
    return kandidaten.slice(0,wieViele||3);
  }

  var vorsUhr=null, vorsSchluessel="";
  // Rechnen erst, wenn der Setter aufhoert zu tippen. Sonst laufen bei jedem
  // Buchstaben ein paar tausend Entfernungsrechnungen und das Handy ruckelt.
  function vorschlaegeSpaeter(){
    if(vorsUhr) clearTimeout(vorsUhr);
    vorsUhr=setTimeout(function(){ drawVorschlaege(); },400);
  }
  function drawVorschlaege(erzwingen){
    var feld=$("vorsFeld"), box=$("vorsBox"), hint=$("vorsHint");
    if(!feld||!box) return;
    var ad0=adrJetzt();
    var schluessel=(ad0.plz||"")+"|"+(ad0.ort||"")+"|"+(+$("f_dauer").value||RULES.slotMin)+"|"+S.appts.length;
    if(!erzwingen && schluessel===vorsSchluessel && box.innerHTML){ markiereWahl(); return; }
    vorsSchluessel=schluessel;
    var liste=besteTermine(14,3);
    if(liste===null){ feld.hidden=true; box.innerHTML=""; return; }
    feld.hidden=false;
    if(!liste.length){
      box.innerHTML="";
      hint.textContent="In den nächsten zwei Wochen passt nichts, ohne dass eine Fahrt zu knapp wird. Nimm den Kalender unten.";
      return;
    }
    box.innerHTML=liste.map(function(v,i){
      var d=parseYmd(v.datum);
      var warum = v.voll
        ? v.voll+" Termin"+(v.voll>1?"e":"")+" an dem Tag in der Nähe"
        : "noch kein Termin an dem Tag";
      var an=(sel.datum===v.datum&&sel.zeit===v.zeit);
      return '<button type="button" class="vorschlag'+(i===0?" top":"")+'" data-d="'+esc(v.datum)+'" data-t="'+esc(v.zeit)+'"'+
        ' aria-pressed="'+an+'">'+
        '<span class="vtag">'+esc(DOW_S[(d.getDay()+6)%7]+" "+pad(d.getDate())+"."+pad(d.getMonth()+1)+".")+' '+esc(v.zeit)+'</span>'+
        '<span class="vwarum">'+esc(warum)+'</span>'+
        '<span class="vzus">'+esc(v.zusatz<=5?"kaum Umweg":"rund "+minText(v.zusatz)+" mehr")+'</span>'+
      '</button>';
    }).join("");
    hint.textContent="Am Telefon zwei davon anbieten statt offen zu fragen. Die Fahrzeit ist geschätzt, kein echtes Routing.";
    Array.prototype.forEach.call(box.querySelectorAll(".vorschlag"),function(b){
      b.onclick=function(){
        $("f_datum").value=b.dataset.d;
        $("f_zeit").value=b.dataset.t;
        drawZeiten(); markiereWahl();
      };
    });
    markiereWahl();
  }
  function markiereWahl(){
    var box=$("vorsBox"); if(!box) return;
    Array.prototype.forEach.call(box.querySelectorAll(".vorschlag"),function(b){
      b.setAttribute("aria-pressed", String(sel.datum===b.dataset.d && sel.zeit===b.dataset.t));
    });
  }

  function drawZeiten(){
    sel.datum=$("f_datum").value||sel.datum;
    sel.closer=meinC;
    sel.dauer=+$("f_dauer").value||RULES.slotMin;
    sel.zeit=$("f_zeit").value||"";

    var d=parseYmd(sel.datum), minMs=Date.now()+RULES.leadHours*3600*1000;
    var _ad=adrJetzt(), plzJetzt=_ad.plz, ortJetzt=_ad.ort;
    var html="", frei=0;
    for(var m=RULES.openHour*60; m+sel.dauer<=(RULES.closeHour+1)*60; m+=30){
      var t=zeitText(m), k=konflikt(sel.datum,sel.closer,m,sel.dauer);
      var ms=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(m/60),m%60).getTime();
      var spaet=ms<minMs, blockiert=(k||spaet);
      var engT=!blockiert&&fahrtPruefung(sel.datum,sel.closer,m,sel.dauer,plzJetzt,ortJetzt,a.id).eng;
      if(!blockiert) frei++;
      html+='<button class="slot'+(engT?" eng":"")+'" data-t="'+t+'"'+(blockiert?" disabled":"")+
        ' aria-pressed="'+(sel.zeit===t)+'" title="'+(k?esc("Belegt: "+name(k)):(spaet?"Zu kurzfristig":(engT?"Fahrzeit wird knapp":"")))+'">'+t+'</button>';
    }
    $("slotBox").innerHTML=html;
    $("slotHint").textContent = frei
      ? "Vorschläge im Halbstundentakt für "+sel.dauer+" Minuten. Jede andere Uhrzeit kannst du oben eintragen."
      : "An dem Tag passt nichts mehr in "+sel.dauer+" Minuten. Nimm den nächsten Tag oder eine kürzere Dauer.";
    Array.prototype.forEach.call($("slotBox").querySelectorAll(".slot"),function(b){
      b.onclick=function(){ $("f_zeit").value=b.dataset.t; drawZeiten(); };
    });

    var box=$("konfliktBox"), out="";
    var spT=gesperrt(sel.datum,sel.closer);
    if(spT) out+='<div class="stop"><b>Tag ist gesperrt</b>'+esc(sel.closer)+' ist an dem Tag nicht da'+(spT.grund?': '+esc(spT.grund):'')+'.</div>';
    if(sel.zeit){
      var von=zeitInMin(sel.zeit), k2=konflikt(sel.datum,sel.closer,von,sel.dauer);
      var endeTxt=zeitText(von+sel.dauer);
      var _a2=adrJetzt();
      var fp=fahrtPruefung(sel.datum,sel.closer,von,sel.dauer,_a2.plz,_a2.ort,a.id);
      if(k2){
        out='<div class="stop"><b>Zeit ist belegt</b>'+esc(sel.closer)+' hat zu der Zeit schon '+esc(name(k2))+
          ' ('+esc(k2.zeit)+' bis '+esc(zeitText(zeitInMin(k2.zeit)+(+k2.dauer||60)))+'). Wähl eine andere Uhrzeit.</div>';
      } else {
        var msSel=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(von/60),von%60).getTime();
        if(msSel<minMs) out='<div class="warnbox">Weniger als '+RULES.leadHours+' Stunden Vorlauf. Geht, aber der Closer muss es schaffen.</div>';
        else if(von<RULES.openHour*60||von+sel.dauer>(RULES.closeHour+1)*60)
          out='<div class="warnbox">Liegt außerhalb der üblichen Zeiten ('+RULES.openHour+':00 bis '+(RULES.closeHour+1)+':00). Geht, kurz mit dem Closer klären.</div>';
        else out='<p class="hint">Termin von '+esc(sel.zeit)+' bis '+esc(endeTxt)+' Uhr.</p>';
      }
      if(fp.meldungen.length){
        out+= fp.eng
          ? '<div class="warnbox" style="margin-top:8px"><b>Fahrzeit wird knapp.</b><br>'+fp.meldungen.map(esc).join("<br>")+'</div>'
          : '<p class="hint" style="margin-top:6px">🚗 '+fp.meldungen.map(esc).join(" ")+'</p>';
      }
      if(fp.unklar.length){
        out+='<div class="warnbox" style="margin-top:8px"><b>Fahrzeit kann ich nicht prüfen.</b><br>'+
          'Unbekannter Ort bei '+esc(fp.unklar.join(" und "))+'. Postleitzahl prüfen, dann rechne ich mit.</div>';
      }
    }
    box.innerHTML=out;
  }

  $("f_pg").onchange=quali;
  $("f_wohn").onchange=quali;
  $("f_datum").onchange=drawZeiten;
  $("f_closer").onchange=drawZeiten;
  $("f_zeit").oninput=drawZeiten;
  $("f_zeit").onchange=drawZeiten;
  $("f_zeit").onblur=drawZeiten;
  $("f_dauer").onchange=drawZeiten;
  $("f_adr").oninput=function(){ plzCheck(); drawZeiten(); vorschlaegeSpaeter(); };
  $("f_dauer").addEventListener("change",function(){ drawVorschlaege(true); });
  drawVorschlaege();
  var gewaehlt=(a.hinweise||[]).slice();
  Array.prototype.forEach.call($("hinweisBox").querySelectorAll("[data-h]"),function(b){
    b.onclick=function(){
      var h=b.dataset.h, i=gewaehlt.indexOf(h);
      if(i>-1) gewaehlt.splice(i,1); else gewaehlt.push(h);
      b.setAttribute("aria-pressed",String(i<0));
    };
  });
  function telCheck(){
    var t=$("f_tel").value.replace(/[^0-9]/g,""), h=$("telHint");
    if(!h) return;
    if(t.length<6){ h.textContent=""; h.style.color=""; return; }
    var treffer=S.appts.filter(function(x){
      return x.id!==a.id && String(x.telefon||"").replace(/[^0-9]/g,"")===t;
    })[0];
    if(treffer){
      h.textContent="Achtung: diese Nummer steht schon bei "+name(treffer)+", "+deDate(parseYmd(treffer.datum))+" "+treffer.zeit+".";
      h.style.color="var(--warn)";
    } else { h.textContent=""; h.style.color=""; }
  }
  $("f_tel").oninput=telCheck;

  quali(); plzCheck(); telCheck(); drawZeiten(); zeigeSchritt(1);

  // Enter springt weiter, im letzten Feld wird gespeichert
  (function(){
    var reihe=["f_vor","f_nach","f_tel","f_adr","f_datum","f_zeit","f_dauer","f_pg","f_wohn","f_notiz"];
    reihe.forEach(function(id,i){
      var el=$(id); if(!el) return;
      el.addEventListener("keydown",function(e){
        if(e.key!=="Enter"||e.shiftKey) return;
        if(id==="f_notiz") return;
        e.preventDefault();
        for(var j=i+1;j<reihe.length;j++){
          var n=$(reihe[j]);
          if(n&&!n.disabled){ n.focus(); if(n.select) try{ n.select(); }catch(x){} return; }
        }
        (schritt===1?$("weiterBtn"):$("saveBtn")).click();
      });
    });
  })();

  $("abortBtn").onclick=closeOverlay;

  function fehler(msg,focus){
    var err=$("formErr");
    err.hidden=false; err.textContent=msg;
    if(focus){ var f=$(focus); if(f&&!f.closest("[hidden]")) f.focus(); }
    return false;
  }
  function schritt1Ok(){
    var err=$("formErr"); err.hidden=true;
    var vor=$("f_vor").value.trim(), nach=$("f_nach").value.trim();
    if(!vor&&!nach) return fehler("Vorname und Nachname fehlen.","f_vor");
    if(!$("f_tel").value.trim()) return fehler("Ohne Telefonnummer kann der Closer nicht zurückrufen.","f_tel");
    var adr=adrJetzt();
    if(!adr.strasse||(!adr.ort&&!adr.plz)) return fehler("Adresse fehlt, der Closer fährt hin.","f_adr");
    var sp=gesperrt(sel.datum,sel.closer);
    if(sp) return fehler(sel.closer+" ist an dem Tag nicht da"+(sp.grund?" ("+sp.grund+")":"")+". Wähl einen anderen Tag.","f_datum");
    drawZeiten();
    if(!sel.zeit) return fehler("Trag eine Uhrzeit ein oder wähl einen Vorschlag.","f_zeit");
    if(konflikt(sel.datum,sel.closer,zeitInMin(sel.zeit),sel.dauer))
      return fehler("Zu der Zeit ist schon ein Termin. Wähl eine andere Uhrzeit.","f_zeit");
    return true;
  }
  $("weiterBtn").onclick=function(){ if(schritt1Ok()) zeigeSchritt(2); };
  $("zurueckBtn").onclick=function(){ $("formErr").hidden=true; zeigeSchritt(1); };

  $("saveBtn").onclick=function(){
    var err=$("formErr");
    function fail(msg,focus){ err.hidden=false; err.textContent=msg; if(focus) $(focus).focus(); }
    if(!schritt1Ok()){ zeigeSchritt(1); return; }
    var vor=$("f_vor").value.trim(), nach=$("f_nach").value.trim(), adr=adrJetzt();
    if(!$("f_pg").value) return fail("Pflegegrad fehlt. Frag danach, ohne ihn geht es nicht weiter.","f_pg");
    if(!quali()) return fail("Dieser Lead qualifiziert sich nicht für einen Termin, siehe Hinweis oben.","f_pg");
    drawZeiten();
    if(konflikt(sel.datum,sel.closer,zeitInMin(sel.zeit),sel.dauer))
      return fail("Die Zeit ist bei "+sel.closer+" schon belegt.","f_zeit");
    err.hidden=true;

    var wasMove=!!edit, oldWhen=edit?(deDate(parseYmd(edit.datum))+" "+edit.zeit):"";
    var obj={
      id:edit?edit.id:uid(),
      vorname:vor, nachname:nach,
      telefon:$("f_tel").value.trim(),
      strasse:adr.strasse, plz:adr.plz, ort:adr.ort,
      pflegegrad:$("f_pg").value, wohnform:$("f_wohn").value,
      notiz:$("f_notiz").value.trim(), hinweise:gewaehlt,
      entscheider:$("f_ent").checked, papiere:$("f_pap").checked,
      datum:sel.datum, zeit:sel.zeit, dauer:sel.dauer,
      closer:sel.closer, setter:edit?edit.setter:S.me.name,
      status:edit?(edit.status==="abgesagt"?"geplant":edit.status):"geplant",
      leistungen:edit?(edit.leistungen||[]):[],
      createdAt:edit?edit.createdAt:Date.now(),
      updatedAt:Date.now(), updatedBy:S.me.name
    };
    upsertAppt(obj).then(function(){
      var wer=(vor+" "+nach).trim();
      if(wasMove) logEvent("verschoben",wer+" verschoben auf "+deDate(parseYmd(obj.datum))+" "+obj.zeit,obj.id,"verschoben");
      else logEvent("neu","Neuer Termin: "+wer+" ("+pgText(obj)+") am "+deDate(parseYmd(obj.datum))+" um "+obj.zeit+" bei "+obj.closer,obj.id);
      closeOverlay();
      S.weekStart=mondayOf(parseYmd(obj.datum));
      render();
      toast(wasMove?"Termin verschoben, alle sind informiert.":"Termin eingetragen, alle sind informiert.");
    }).catch(function(){ fail("Speichern hat nicht geklappt. Probier es noch einmal."); });
  };
  setTimeout(function(){ var f=$("f_vor"); if(f&&!edit) f.focus(); },60);
}

function thema(){
  var t=null;
  try{ t=localStorage.getItem("sb_thema"); }catch(e){}
  return (t==="dunkel")?"dunkel":"hell";
}
function themaSetzen(t){
  try{ localStorage.setItem("sb_thema",t); }catch(e){}
  themaAnwenden();
}
function themaAnwenden(){
  var t=thema();
  if(t==="dunkel") document.documentElement.setAttribute("data-theme","dunkel");
  else document.documentElement.removeAttribute("data-theme");
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", t==="dunkel" ? "#0C1420" : "#1657B0");
}
function zeichneThema(){

  Array.prototype.forEach.call(box.querySelectorAll("button"),function(b){

function zeichnePush(){
  var box=$("pushBox"); if(!box) return;
  var st=PUSH.status();
  if(st==="geht nicht"){
    box.innerHTML='<p class="hint">Dieser Browser kann keine Mitteilungen. Nimm Safari auf dem iPhone oder Chrome auf Android.</p>';
    return;
  }
  if(st==="homescreen"){
    box.innerHTML='<div class="warnbox"><b>Erst zum Home-Bildschirm hinzufügen</b><br>'+
      'Auf dem iPhone gehen Mitteilungen nur, wenn die Seite als App gespeichert ist. '+
      'Unten auf das Teilen-Symbol tippen, dann <b>Zum Home-Bildschirm</b>. Danach die App von dort öffnen und hier wieder hereinschauen.</div>';
    return;
  }
  if(st==="denied"){
    box.innerHTML='<p class="hint">Mitteilungen sind für diese Seite gesperrt. Das lässt sich nur in den Einstellungen des Handys wieder erlauben.</p>';
    return;
  }
  var an=(st==="granted");
  box.innerHTML='<p class="hint" style="margin-bottom:8px">'+
      (an?'Dieses Gerät bekommt Mitteilungen bei neuen Terminen, Änderungen und eine Erinnerung vor dem Termin.'
        : 'Neuer Termin, Absage, Erinnerung vor dem Termin und morgens die Übersicht des Tages.')+'</p>'+
    '<button class="btn '+(an?"":"primary")+'" id="pushBtn">'+(an?"Dieses Gerät abmelden":"Mitteilungen einschalten")+'</button>'+
    '<p class="err" id="pushErr" hidden style="margin-top:8px"></p>';
  $("pushBtn").onclick=function(){
    var b=$("pushBtn"), e=$("pushErr");
    e.hidden=true; b.disabled=true;
    var p = an ? PUSH.abmelden() : PUSH.anmelden();
    p.then(function(){
      b.disabled=false;
      toast(an?"Dieses Gerät bekommt keine Mitteilungen mehr.":"Mitteilungen sind an.");

/* ---------------- Testlauf ---------------- */
function simulateCloser(){
  var target=S.appts.filter(function(a){ return a.status==="geplant"; })[0], phase="stattgefunden";
  if(!target){ target=S.appts.filter(function(a){ return a.status==="stattgefunden"; })[0]; phase="folgetermin"; }
  if(!target){ toast("Kein Termin da, den ein Closer bearbeiten könnte."); return; }
  var who=target.closer||"Closer";
  target.status=phase; target.updatedAt=Date.now(); target.updatedBy=who;
  upsertAppt(target);
  store.addEvent({
    id:"e-"+target.id+"-status", ts:Date.now(), by:who, kind:"status", apptId:target.id, kalender:target.closer||"",
    text:name(target)+" "+STATUS_SATZ[phase]+" ("+deDate(parseYmd(target.datum))+")"
  });
}

/* ---------------- Feed ---------------- */
function sichtbareEvents(){
  var c=meinCloser();
  if(istAdmin()&&!c) return S.activity.slice();
  if(!c) return [];
  return S.activity.filter(function(e){
    if(e.kalender) return e.kalender===c;
    if(e.apptId) return S.appts.filter(function(a){ return a.id===e.apptId&&a.closer===c; }).length>0;
    return false;
  });
}

function feedHtml(limit){
  var alle=sichtbareEvents();
  var liste=limit?alle.slice(0,limit):alle;
  if(!liste.length) return '<p class="hint">Noch keine Änderungen. Sobald jemand einen Termin setzt, verschiebt oder abschließt, steht es hier.</p>';
  return '<div class="feed">'+liste.map(function(e){
    var unseen=e.ts>S.lastSeen&&e.by!==(S.me?S.me.name:"");
    var da=e.apptId&&erlaubteTermine().filter(function(x){ return x.id===e.apptId; }).length;
    var tag=da?"button":"div", extra=da?' data-appt="'+esc(e.apptId)+'" title="Termin öffnen"':"";
    return '<'+tag+' class="ev '+esc(e.kind)+(unseen?" unseen":"")+(da?" klickbar":"")+'"'+extra+'><span class="dot"></span>'+
      '<span class="txt"><b>'+esc(e.by)+'</b> '+esc(e.text)+'</span>'+
      '<span class="when">'+esc(relTime(e.ts))+'</span></'+tag+'>';
  }).join("")+'</div>';
}

function feedKlicks(root){
  if(!root) return;
  Array.prototype.forEach.call(root.querySelectorAll("[data-appt]"),function(b){
    b.onclick=function(ev){
      ev.stopPropagation();
      openAppt(b.dataset.appt);
    };
  });
}

function renderSide(){
  var box=$("sideFeed"); if(!box) return;
  box.innerHTML='<h3>Aktivität</h3>'+feedHtml(25);
  feedKlicks(box);
  box.onclick=function(){
    if(!S.activity.length) return;
    S.lastSeen=Date.now(); LS.set("sb_lastSeen",String(S.lastSeen));
    renderBell(); renderSide();
  };
}

function neuerungenHtml(){
  if(!NEUERUNGEN || !NEUERUNGEN.punkte || !NEUERUNGEN.punkte.length) return "";
  return '<div class="neuerungen">'+
    '<div class="n-kopf"><b>Neu in dieser Fassung</b><span class="mono">Stand '+esc(NEUERUNGEN.stand.slice(0,10))+'</span></div>'+
    '<ul>'+NEUERUNGEN.punkte.map(function(t){ return '<li>'+esc(t)+'</li>'; }).join("")+'</ul>'+
    '<p class="hint">Wenn etwas davon bei dir nicht auftaucht, App einmal schließen und neu öffnen.</p>'+
  '</div>';
}

function openFeed(keep){
  var html=neuerungenHtml()+feedHtml(0);
  overlay("Aktivität",html,
    '<button class="btn" id="simBtn">Closer simulieren</button>'+
    '<span class="hint" style="flex:1;align-self:center">Testlauf: ein Kollege bearbeitet einen Termin.</span>',"feed");
  $("simBtn").onclick=simulateCloser;
  feedKlicks(document.querySelector('[data-overlay="feed"]'));
  if(!keep){
    S.lastSeen=Date.now(); LS.set("sb_lastSeen",String(S.lastSeen));
    neuerungenMerken();
    setTimeout(renderBell,400);
  }
}
function renderBell(){
  var me=S.me?S.me.name:"";
  var n=sichtbareEvents().filter(function(e){ return e.ts>S.lastSeen&&e.by!==me; }).length;
  if(NEUERUNGEN && NEUERUNGEN.punkte && NEUERUNGEN.punkte.length && !neuerungenGelesen()) n++;
  var c=$("bellCount");
  if(n>0){ c.hidden=false; c.textContent=n>99?"99+":String(n); } else c.hidden=true;
}

/* ---------------- Sperrtage ---------------- */
function openSperren(){
  var c=meinCloser();
  var meine=S.sperr.filter(function(x){ return x.closer===c; })
    .sort(function(a,b){ return a.datum<b.datum?-1:1; });
  var body='<p class="hint">Gestrichene Tage sind für die Setter gesperrt, sie können dort keinen Termin eintragen und sehen den Grund im Kalender.</p>'+
    '<div class="two">'+
      '<div class="field"><label for="sp_datum">Tag</label><input type="date" id="sp_datum" class="mono" value="'+esc(ymd(new Date()))+'"></div>'+
      '<div class="field"><label for="sp_grund">Grund, kurz</label><input id="sp_grund" autocomplete="off" placeholder="Hochzeit, Urlaub, privat"></div>'+
    '</div>'+
    '<button class="btn primary" id="sp_go" style="width:100%">Tag streichen</button>'+
    '<p class="err" id="sp_err" hidden></p>'+
    (meine.length?'<hr class="sep"><div class="sec-label" style="margin-bottom:6px">Gestrichene Tage</div>'+
      '<div class="people">'+meine.map(function(x){
        return '<div class="person-row"><span class="person" style="cursor:default">'+
          '<b>'+esc(deDate(parseYmd(x.datum)))+'</b><span class="r">'+esc(x.grund||"nicht da")+'</span></span>'+
          '<button class="del" data-frei="'+esc(x.datum)+'" title="wieder freigeben">✕</button></div>';
      }).join("")+'</div>':'');
  overlay("Tag streichen",body,"","sperr");
  $("sp_go").onclick=function(){
    var d=$("sp_datum").value, g=$("sp_grund").value.trim(), err=$("sp_err");
    err.hidden=true;
    if(!d){ err.hidden=false; err.textContent="Wähl einen Tag."; return; }
    var belegt=S.appts.filter(function(a){ return a.datum===d&&a.closer===c&&a.status!=="abgesagt"; });
    if(belegt.length){
      err.hidden=false;
      err.textContent="An dem Tag stehen noch "+belegt.length+" Termine. Erst verschieben oder absagen, dann streichen.";
      return;
    }
    tagSperren(d,c,g).then(function(){ toast(deDate(parseYmd(d))+" ist gestrichen."); openSperren(); });
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-frei]"),function(b){
    b.onclick=function(){ tagFreigeben(b.dataset.frei,c).then(function(){ openSperren(); }); };
  });
}


function gesperrt(datum,closer){
  return S.sperr.filter(function(x){ return x.datum===datum&&x.closer===closer; })[0]||null;
}
function tagSperren(datum,closer,grund){
  var x={ id:"sp-"+closer+"-"+datum, datum:datum, closer:closer, grund:grund||"", von:S.me.name, ts:Date.now() };
  S.sperr=S.sperr.filter(function(y){ return y.id!==x.id; }).concat([x]);
  render();
  return store.saveSperr(x).then(function(){
    logEvent("abgesagt",deDate(parseYmd(datum))+" ist gesperrt"+(grund?": "+grund:""));
  });
}
function tagFreigeben(datum,closer){
  var id="sp-"+closer+"-"+datum;
  S.sperr=S.sperr.filter(function(y){ return y.id!==id; });
  render();
  return store.delSperr(id).then(function(){
    logEvent("neu",deDate(parseYmd(datum))+" ist wieder frei");
  });
}

/* ---------------- Suche ---------------- */
function suchen(q){
  q=String(q||"").trim().toLowerCase();
  if(q.length<2) return [];
  var ziffern=q.replace(/[^0-9]/g,"");
  return erlaubteTermine().filter(function(a){
    var txt=[a.vorname,a.nachname,a.ort,a.strasse,a.plz,a.notiz,(a.hinweise||[]).join(" ")].join(" ").toLowerCase();
    if(txt.indexOf(q)>-1) return true;
    if(ziffern.length>=3 && String(a.telefon||"").replace(/[^0-9]/g,"").indexOf(ziffern)>-1) return true;
    return false;
  }).sort(function(a,b){ return startMs(b)-startMs(a); }).slice(0,12);
}

function zeigeSuche(){
  var q=$("suchFeld").value, box=$("suchListe");
  if(String(q).trim().length<2){ box.hidden=true; box.innerHTML=""; return; }
  var treffer=suchen(q);
  box.hidden=false;
  if(!treffer.length){
    box.innerHTML='<div class="suchleer">Nichts gefunden. Suche nach Vorname, Nachname, Ort oder Telefonnummer.</div>';
    return;
  }
  box.innerHTML=treffer.map(function(a){
    var st=STATUS[a.status]||STATUS.geplant;
    return '<button class="streffer" data-id="'+esc(a.id)+'">'+
      '<b>'+esc(name(a))+'</b>'+
      '<span>'+esc(deDate(parseYmd(a.datum)))+' um '+esc(a.zeit)+' · '+esc(a.ort||"ohne Ort")+' · '+esc(st.label)+'</span>'+
      '<span>'+esc(a.telefon||"")+'</span>'+
    '</button>';
  }).join("");
  Array.prototype.forEach.call(box.querySelectorAll(".streffer"),function(b){
    b.onclick=function(){
      schliesseSuche();
      openAppt(b.dataset.id);
    };
  });
}
function schliesseSuche(){
  var box=$("suchListe");
  if(box){ box.hidden=true; box.innerHTML=""; }
  var f=$("suchFeld"); if(f) f.value="";
}

/* ---------------- wiring ---------------- */
function wire(){
  $("lg_go").onclick=anmelden;
  $("zeigNeu").onclick=function(){ zeigeNeu(true); };
  $("zeigLogin").onclick=function(){ zeigeNeu(false); };
  $("nu_go").onclick=setterAnlegen;
  $("nu_user").onblur=function(){ this.value=benutzerNorm(this.value); };
  $("nu_pw").onkeydown=function(e){ if(e.key==="Enter") setterAnlegen(); };
  $("lg_pw").onkeydown=function(e){ if(e.key==="Enter") anmelden(); };
  $("lg_user").onkeydown=function(e){ if(e.key==="Enter") $("lg_pw").focus(); };

  Array.prototype.forEach.call(document.querySelectorAll(".ul-knopf"),function(b){
    b.onclick=function(){ S.view=b.dataset.view; render(); };
  });
  function springen(richtung){
    var m=modus();
    if(m==="tag"){
      S.tag=ymd(addDays(parseYmd(S.tag),richtung));
      S.weekStart=mondayOf(parseYmd(S.tag));
    } else if(m==="monat"){
      var a=monatsAnker(); a.setMonth(a.getMonth()+richtung);
      S.tag=ymd(a); S.weekStart=mondayOf(a);
    } else {
      S.weekStart=addDays(S.weekStart,7*richtung);
      S.tag=ymd(S.weekStart);
    }
    render();
  }
  $("prevW").onclick=function(){ springen(-1); };
  $("nextW").onclick=function(){ springen(1); };
  $("heuteBtn").onclick=function(){
    var h=new Date();
    S.tag=ymd(h); S.weekStart=mondayOf(h); render();
  };
  $("sperrBtn").onclick=function(){ openSperren(); };
  Array.prototype.forEach.call($("modusBar").querySelectorAll("button"),function(b){
    b.onclick=function(){ setModus(b.dataset.m); };
  });
  // Wischen nach links und rechts blaettert
  (function(){
    var el=$("calGrid"); if(!el) return;
    var x0=null,y0=null;
    el.addEventListener("touchstart",function(e){
      if(e.touches.length!==1){ x0=null; return; }
      x0=e.touches[0].clientX; y0=e.touches[0].clientY;
    },{passive:true});
    el.addEventListener("touchend",function(e){
      if(x0==null) return;
      var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
      x0=null;
      if(modus()==="woche") return;                  // dort wird seitwaerts geschoben
      if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)) return;
      springen(dx<0?1:-1);
    },{passive:true});
  })();
  $("newBtn").onclick=function(){ openForm(null); };
  $("bellBtn").onclick=function(){ openFeed(false); };
  $("whoBtn").onclick=openWho;
  $("suchFeld").oninput=zeigeSuche;
  $("suchFeld").onfocus=zeigeSuche;
  $("suchFeld").onkeydown=function(e){
    if(e.key==="Escape"){ schliesseSuche(); $("suchFeld").blur(); }
    if(e.key==="Enter"){
      var erster=document.querySelector(".streffer");
      if(erster) erster.click();
    }
  };
  document.addEventListener("click",function(e){
    var box=$("sucheBox");
    if(box&&!box.contains(e.target)) { var l=$("suchListe"); if(l) l.hidden=true; }
  });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ closeOverlay(); schliesseSuche(); } });
  document.addEventListener("mousemove",function(e){ zugZieh(e.clientX); });
  document.addEventListener("mouseup",zugEnde);
  var breitVorher=window.innerWidth>=900;
  window.addEventListener("resize",function(){
    var jetztBreit=window.innerWidth>=900;
    if(jetztBreit!==breitVorher){ breitVorher=jetztBreit; render(); }
  });
  document.addEventListener("touchmove",function(e){ if(ZUG.aktiv){ zugZieh(e.touches[0].clientX); e.preventDefault(); } },{passive:false});
  document.addEventListener("touchend",zugEnde);
  setInterval(function(){ if(document.querySelector('[data-overlay="feed"]')) openFeed(true); },60000);
}

start();
})();
</script>
