<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1657B0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Setterboard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<title>Setterboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F1F6FC;
  --line:#D5E2F1;
  --line-soft:#E8EFF8;
  --ink:#0E1B2A;
  --ink-2:#42566C;
  --ink-3:#7789A0;
  --accent:#0B5FA5;
  --accent-soft:#E1EDF9;
  --accent-ink:#084B83;
  --money:#0F7355;
  --money-soft:#DFF1EA;
  --ok:#0F7355;
  --ok-soft:#DFF1EA;
  --bad:#B3261E;
  --bad-soft:#FAE8E6;
  --warn:#9C5A00;
  --warn-soft:#FAEFDF;
  --shadow:0 1px 2px rgba(14,27,42,.05),0 10px 26px -14px rgba(11,95,165,.28);
  --radius:10px;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}

/* Dunkler Kalender. Wird über den Schalter unter Zugänge eingestellt. */
:root[data-theme="dunkel"]{
  --paper:#0C1420;
  --surface:#131E2D;
  --surface-2:#1A283A;
  --line:#2A3B52;
  --line-soft:#223246;
  --ink:#EAF1F9;
  --ink-2:#AFC1D6;
  --ink-3:#7D91A9;
  --accent:#2F7FD4;
  --accent-soft:#1B3350;
  --accent-ink:#9CC8F2;
  --money:#4BC79C;
  --money-soft:#153229;
  --ok:#4BC79C;
  --ok-soft:#153229;
  --bad:#F08A80;
  --bad-soft:#3A1E1B;
  --warn:#E3A552;
  --warn-soft:#352719;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1440px;margin:0 auto;padding-block:10px;padding-inline:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:4px}
.brand b{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.03em;color:var(--accent)}
.brand span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em}
.kopfkal{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--line)}
.kopfkal small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);line-height:1.1;font-weight:600}
.kopfkal b{display:block;font-family:var(--font-display);font-size:17px;letter-spacing:-.02em;line-height:1.2}
@media (max-width:640px){ .kopfkal{padding-left:8px} .kopfkal b{font-size:15px} }
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:8px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.spacer{flex:1 1 auto}
.suche{position:relative;flex:0 1 260px;max-width:300px;min-width:150px;margin-left:10px}
.suche .lupe{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6;pointer-events:none}
.suche input{
  width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;
  padding:9px 14px 9px 32px;font-size:14px;
}
.suche input:focus{background:var(--surface);border-color:var(--accent)}
.suchliste{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:40;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);max-height:min(420px,70vh);overflow-y:auto;padding:5px;
}
.streffer{
  display:block;width:100%;text-align:left;border:0;background:transparent;cursor:pointer;
  padding:9px 10px;border-radius:8px;
}
.streffer:hover,.streffer:focus-visible{background:var(--surface-2)}
.streffer b{display:block;font-size:14.5px}
.streffer span{display:block;font-size:12.5px;color:var(--ink-3)}
.suchleer{padding:12px 10px;font-size:13.5px;color:var(--ink-3)}
@media (max-width:640px){
  .suche{order:9;flex:1 0 100%;max-width:none;margin-top:2px}
}
.who{display:flex;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px}
.avatar{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:12px;background:var(--accent-soft);color:var(--accent-ink)}
.who small{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;display:block;line-height:1.1}
.who b{font-size:13px;font-weight:600;display:block;line-height:1.2}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.bell svg{width:18px;height:18px;stroke:var(--ink-2);fill:none;stroke-width:1.7}
.bell .count{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;background:var(--bad);color:#fff;border-radius:999px;font-family:var(--font-mono);font-size:11px;font-weight:600;display:grid;place-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;max-width:1440px;width:100%;margin:0 auto;padding-inline:16px;padding-block:16px 60px}

/* ---------- week ---------- */
.weekbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.weekbar h2{font-size:15px;font-weight:700;letter-spacing:0;color:var(--ink-2);text-transform:uppercase}
.startort{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;white-space:nowrap}
.weekbar .range{font-family:var(--font-mono);font-size:13px;color:var(--ink-3)}
.nav{display:flex;gap:4px}
.nav button{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2);font-size:15px;line-height:1}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filters .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* Umschalter Tag / Woche / Monat */
.modus{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.modus button{border:0;background:transparent;border-radius:8px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-3);cursor:pointer;line-height:1}
.modus button[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 2px rgba(15,35,70,.12)}
.heutebtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}

/* Wochenraster auf schmalen Geraeten seitwaerts schiebbar */
html,body{max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
.calscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
/* Abstand zwischen den Feldgruppen im Terminformular */
#schritt1>.two,#schritt2>.two{margin-bottom:12px}
.calinner{min-width:100%}

/* Monatsgitter */
.monkopf{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0}
.monkopf div{padding:7px 4px;text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.mongrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.montag{border-left:1px solid var(--line);border-top:1px solid var(--line);min-height:104px;padding:5px 5px 6px;text-align:left;background:transparent;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.montag:nth-child(7n+1){border-left:0}
.montag .mzahl{font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:var(--ink-2);align-self:flex-start;line-height:1.5;min-width:22px;text-align:center;border-radius:999px}
.montag.fremd{background:var(--surface-2)}
.montag.fremd .mzahl{color:var(--ink-3);opacity:.6}
.montag.heute .mzahl{background:var(--accent);color:#fff}
.montag.gesperrt{background:repeating-linear-gradient(135deg,transparent 0 9px,var(--line-soft) 9px 18px)}
.montag:hover{background:var(--accent-soft)}
.mzeile{display:flex;gap:4px;align-items:baseline;font-size:11.5px;line-height:1.3;border-left:3px solid var(--st,var(--accent));padding-left:4px;border-radius:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mzeile b{font-family:var(--font-mono);font-weight:600;color:var(--ink-3);font-size:10.5px}
.mzeile span{overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mmehr{font-size:10.5px;color:var(--ink-3)}
.mpunkte{display:flex;gap:3px;flex-wrap:wrap;margin-top:1px}
.mpunkte i{width:6px;height:6px;border-radius:999px;background:var(--st,var(--accent));display:block}
.weekwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.weekmain{min-width:0}
.side{
  position:sticky;top:70px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 14px;max-height:calc(100vh - 100px);overflow-y:auto;cursor:default;
}
.side h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:6px}
.side .ev{padding:9px 0;font-size:13.5px}
.side .ev .txt{font-size:13.5px}
.side .ev .when{font-size:11px}
@media (max-width:1099px){ .weekwrap{grid-template-columns:1fr} .side{display:none} }
/* Zeitraster mit Achse links */
.cal{--h:58px;--axis:52px}
.tagkopf{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;padding:8px 10px}
.tagnav{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:17px;line-height:1;cursor:pointer;color:var(--ink-2)}
.tagtitel{flex:1;text-align:center;line-height:1.2}
.tagtitel b{display:block;font-family:var(--font-display);font-size:16px}
.tagtitel span{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.calhead{
  display:grid;grid-template-columns:var(--axis) repeat(6,minmax(0,1fr));
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;
}
.calhead .hc{padding:7px 9px;border-left:1px solid var(--line);display:flex;align-items:baseline;gap:6px}
.calhead .hc:first-child{border-left:0}
.calhead .dow{font-family:var(--font-display);font-weight:700;font-size:13px}
.calhead .dnum{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.calhead .hc.today{background:var(--accent-soft)}
.calhead .hc.today .dow{color:var(--accent-ink)}
.calbody{
  display:grid;grid-template-columns:var(--axis) repeat(6,minmax(0,1fr));
  background:var(--surface);border:1px solid var(--line);border-top:0;
  border-radius:0 0 var(--radius) var(--radius);overflow:hidden;
}
.calbody.tagbody{grid-template-columns:var(--axis) minmax(0,1fr)}
.axis{position:relative}
.axis .tick{position:absolute;right:7px;font-family:var(--font-mono);white-space:nowrap;line-height:1}
.axis .tick.major{font-size:12px;font-weight:600;color:var(--ink-2)}
.axis .tick.minor{font-size:9.5px;color:var(--ink-3);opacity:.75}
.daycol{
  position:relative;border-left:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom,var(--line-soft) 0 1px,transparent 1px var(--h));
}
.daycol.frei::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent 0 9px,var(--surface-2) 9px 10px);opacity:.5;
}
.slotbtn{position:absolute;left:0;right:0;border:0;background:transparent;cursor:pointer;padding:0}
.slotbtn:hover{background:var(--accent-soft);opacity:.55}
.tblock{
  z-index:2;
  position:absolute;left:3px;right:3px;cursor:pointer;text-align:left;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--st,var(--accent));
  border-radius:6px;padding:4px 6px;
}
.tblock .stapel{display:flex;flex-direction:column;gap:1px;min-width:0;width:100%}
.tblock span{display:block}
.tblock:hover{border-color:var(--accent);border-left-color:var(--st,var(--accent))}
.tblock .z{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--ink-3);display:inline}
.tblock .n{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tblock.gross{padding:7px 9px}
.tblock.gross .stapel{gap:3px}
.tblock.gross .u{white-space:normal;line-height:1.3}
.tblock .n.gross{white-space:normal;font-size:14px;line-height:1.2;margin-bottom:1px}
.tblock .tmarken{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.tblock .tmarken span{background:var(--accent-soft);color:var(--accent-ink);border-radius:4px;padding:1px 5px;font-size:9.5px;font-weight:600;white-space:nowrap}
.tblock .tnotiz{color:var(--ink-3);font-size:10.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tblock .u{font-size:10.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tblock .ort{font-size:12.5px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.tblock.gross .ort{font-size:14px;color:var(--ink)}
.tblock.st-nichtda{background:var(--bad-soft)}
.tblock.st-stattgefunden{background:var(--ok-soft)}
.tblock.st-folgetermin{background:var(--warn-soft)}
.tblock.st-abgesagt{opacity:.55}
.fahrt{
  position:absolute;left:2px;right:2px;border-radius:5px;z-index:1;
  background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px);
  border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;
}
.fahrt span{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-3)}
.calhead .fahrt-tag{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.daycol.gesperrt{background-color:var(--surface-2)}
.sperrband{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent 0 10px,var(--line-soft) 10px 20px);z-index:4}
.sperrband span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;color:var(--ink-2)}
.jetzt{position:absolute;left:0;right:0;height:2px;background:var(--bad);pointer-events:none;z-index:3}
.jetzt::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:999px;background:var(--bad)}
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:start}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-height:118px;display:flex;flex-direction:column}
.day-head{background:var(--surface-2);border-radius:var(--radius) var(--radius) 0 0}
.day.today{border-color:var(--accent);box-shadow:var(--shadow)}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:9px 11px;border-bottom:1px solid var(--line-soft)}
.day-head .dow{font-family:var(--font-display);font-weight:700;font-size:13px}
.day.today .dow{color:var(--accent)}
.day-head .dnum{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.day-body{padding:8px;display:flex;flex-direction:column;gap:7px}
.day-empty{padding:10px 11px 14px;color:var(--ink-3);font-size:12.5px}
.card{width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--st,var(--ink-3));border-radius:8px;padding:8px 9px;display:flex;flex-direction:column;gap:3px}
.card:hover{border-color:var(--accent);border-left-color:var(--st,var(--ink-3))}
.card .t{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--ink-2)}
.card .k{font-weight:600;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.card .m{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.card .kort{font-size:14px;font-weight:600;color:var(--ink-2);line-height:1.2}
.pg{display:inline-block;font-family:var(--font-mono);font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);border-radius:4px;padding:1px 5px;margin-right:5px}
.pill{display:inline-flex;align-items:center;align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-top:2px}
.pill.geplant{background:var(--accent-soft);color:var(--accent-ink)}
.pill.stattgefunden{background:var(--ok-soft);color:var(--ok)}
.pill.nichtda{background:var(--bad-soft);color:var(--bad)}
.pill.folgetermin{background:var(--warn-soft);color:var(--warn)}
.pill.abgesagt{background:var(--surface-2);color:var(--ink-3)}

/* ---------- panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,25,45,.44);z-index:40;border:0;padding:0}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:50;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.griff{
  position:absolute;left:-15px;top:0;bottom:0;width:28px;cursor:col-resize;z-index:3;
  display:flex;align-items:center;justify-content:flex-start;
}
.griff::before{
  content:"";width:15px;height:60px;border-radius:9px 0 0 9px;
  background:var(--surface);border:1px solid var(--line);border-right:0;
  box-shadow:-3px 0 8px rgba(14,27,42,.10);
}
.griff::after{
  content:"";position:absolute;left:5px;width:3px;height:22px;border-radius:2px;background:var(--ink-3);
}
.griff:hover::before,.griff.zieht::before{border-color:var(--accent);background:var(--accent-soft)}
.griff:hover::after,.griff.zieht::after{background:var(--accent);height:30px}

               ohne dass sich die Fenster gegenseitig abmelden. */
var BLEIBEN = "sb_bleiben";
// Derselbe Platz, den Supabase von sich aus nimmt. So bleiben bestehende Anmeldungen gültig.
var HAUPT_KEY = "sb-" + SB_URL.split("//")[1].split(".")[0] + "-auth-token";

function bleibenAn(){
  try{
    var eigen=sessionStorage.getItem(BLEIBEN);
    if(eigen) return eigen!=="nein";
    return localStorage.getItem(BLEIBEN)!=="nein";
  }catch(e){ return true; }
}
function bleibenSetzen(an){
  try{
    sessionStorage.setItem(BLEIBEN, an?"ja":"nein");   // gilt nur für dieses Fenster
    if(an) localStorage.setItem(BLEIBEN,"ja");         // Vorgabe für neue Fenster
  }catch(e){}
}
function fensterNummer(){
  var n=null;
  try{
    n=sessionStorage.getItem("sb_fenster");
    if(!n){ n=String(Date.now())+String(Math.floor(Math.random()*1000)); sessionStorage.setItem("sb_fenster",n); }
  }catch(e){ n="1"; }
  return n;
}

// Startzustand dieses Fensters. Der Haken beim Anmelden ändert ihn jederzeit.
var FENSTER_MODUS = !bleibenAn();
var SPEICHER_KEY  = FENSTER_MODUS ? ("sb-fenster-"+fensterNummer()) : HAUPT_KEY;
var SPEICHER      = FENSTER_MODUS ? window.sessionStorage : window.localStorage;

function clientBauen(speicher,schluessel){
  if(!(window.supabase && window.supabase.createClient)) return null;
  return window.supabase.createClient(SB_URL, SB_KEY,
    { auth:{ persistSession:true, autoRefreshToken:true, storage:speicher, storageKey:schluessel } });
}
var sbHaupt   = clientBauen(window.localStorage, HAUPT_KEY);
var sbFenster = null;
function fensterClient(){
  if(!sbFenster) sbFenster = clientBauen(window.sessionStorage, "sb-fenster-"+fensterNummer());
  return sbFenster;
}
var sb = FENSTER_MODUS ? fensterClient() : sbHaupt;

/* Umschalten ohne Neustart. Alles im Board arbeitet mit der Variablen sb,
   der Wechsel wirkt daher sofort. */
function clientWechseln(bleiben){
  var neu = bleiben ? sbHaupt : fensterClient();
  if(neu===sb) return;
  sb = neu;
  FENSTER_MODUS = !bleiben;
  beobachten(neu);
}
/* Ein Beobachter je Zugang, meldet aber nur, solange dieser Zugang der aktive ist.
   Sonst würde ein Abmelden in einem anderen Fenster hier durchschlagen. */
var beobachtet=[];
function beobachten(client){
  if(!client || beobachtet.indexOf(client)>-1) return;
  beobachtet.push(client);
  client.auth.onAuthStateChange(function(ereignis){
    if(client!==sb) return;
    if(ereignis==="SIGNED_OUT"){
      S.me=null; $("app").hidden=true; $("untenleiste").hidden=true; $("gate").hidden=false; renderGate();
    }
  });
}

function hashPw(pw){
  var text=String(pw||"")+"::setterboard";
  if(window.crypto&&window.crypto.subtle&&window.crypto.subtle.digest){
    return window.crypto.subtle.digest("SHA-256",new TextEncoder().encode(text)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b),function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
    }).catch(function(){ return einfachHash(text); });
  }
  return Promise.resolve(einfachHash(text));
}
function einfachHash(t){
  var h=5381;
  for(var i=0;i<t.length;i++){ h=((h<<5)+h+t.charCodeAt(i))|0; }
  return "e"+(h>>>0).toString(16);
}
function benutzerNorm(v){
  var t=String(v||"").trim().toLowerCase();
  t=t.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
  t=t.replace(/[\s]+/g,".");          // Leerzeichen werden zum Punkt
  t=t.replace(/[^a-z0-9._-]/g,"");     // alles andere faellt weg
  t=t.replace(/^[._-]+|[._-]+$/g,"");
  return t;
}
function meldung(e){
  var m=(e&&e.message)||"";
  if(/validate email address|invalid format/i.test(m)) return "Der Benutzername darf nur Buchstaben, Zahlen, Punkt, Minus und Unterstrich enthalten.";
  if(/already registered|User already/i.test(m)) return "Diesen Benutzernamen gibt es schon. Nimm einen anderen.";
  if(/Password should be/i.test(m)) return "Das Passwort braucht mindestens sechs Zeichen.";
  return m||"Anlegen hat nicht geklappt.";
}

function sbStore(){
  var cb={team:null,appts:null,act:null,sperr:null}, timer=null, laeuft=false;

  function melde(e){
    var t=(e&&(e.message||e.error_description||e.code))||"Fehler";

  }

  function runde(){
    if(laeuft) return Promise.resolve();
    laeuft=true;
    return sb.from("kalender").select("*").then(function(r){
      if(r.error) throw r.error;
      KAL={}; KAL_ID={};
      (r.data||[]).forEach(function(k){ KAL[k.id]=k; KAL_ID[k.name]=k.id; });
      return sb.from("personen").select("*");
    }).then(function(r){
      if(r.error) throw r.error;
      if(cb.team) cb.team((r.data||[]).map(personAusDb));
      return sb.from("termine").select("*");
    }).then(function(r){
      if(r.error) throw r.error;
      if(cb.appts) cb.appts((r.data||[]).map(terminAusDb));
      return sb.from("sperrtage").select("*");
    }).then(function(r){
      if(r.error) throw r.error;
      if(cb.sperr) cb.sperr((r.data||[]).map(function(x){
        return { id:x.id, datum:x.datum, closer:kalNameVon(x.kalender_id)||"", grund:x.grund||"", von:x.von_name||"" };
      }));
      return sb.from("ereignisse").select("*").order("zeitpunkt",{ascending:false}).limit(60);
    }).then(function(r){
      if(r.error) throw r.error;
      if(cb.act) cb.act((r.data||[]).map(function(e){
        return { id:e.id, ts:new Date(e.zeitpunkt).getTime(), by:e.von_name||"", kind:e.art||"status",
                 text:e.text||"", apptId:e.termin_id||"", kalender:kalNameVon(e.kalender_id)||"" };

      setDiag(S.me ? ("Verbunden. "+S.team.length+" Zugänge, "+S.appts.length+" Termine.") : "Verbindung zum Server steht.");
    }).catch(function(e){ laeuft=false; melde(e); });
  }
  function starten(){ if(timer) return; runde(); timer=setInterval(runde,6000); }
  function jetzt(){ setTimeout(runde,300); }

  return {
    kind:"supabase",
    onTeam:function(f){ cb.team=f; starten(); },
    onAppts:function(f){ cb.appts=f; starten(); },
    onActivity:function(f){ cb.act=f; starten(); },
    onSperr:function(f){ cb.sperr=f; starten(); },

    saveAppt:function(a){

    },
    delAppt:function(id){
      return sb.from("termine").delete().eq("id",id).then(function(r){ if(r.error) throw r.error; jetzt(); });
    },
    saveMember:function(m){
      var daten={ name:m.name, rolle:m.rolle, kalender_id:m.kalender_id||null };
      return sb.from("personen").update(daten).eq("id",m.id).then(function(r){ if(r.error) throw r.error; jetzt(); });
    },
    delMember:function(id){
      return sb.from("personen").delete().eq("id",id).then(function(r){ if(r.error) throw r.error; jetzt(); });
    },
    addEvent:function(e){
      var kid=kalIdVon(e.kalender||meinCloser());
      return sb.from("ereignisse").insert({
        kalender_id:kid, termin_id:(e.apptId&&String(e.apptId).length>30)?e.apptId:null,
        art:e.kind||"status", text:e.text||"", von_name:e.by||""
      }).then(function(r){ if(r.error) throw r.error; jetzt(); });
    },
    delEvent:function(id){
      return sb.from("ereignisse").delete().eq("id",id).then(function(){ jetzt(); });
    },
    saveSperr:function(x){
      return sb.from("sperrtage").upsert({
        kalender_id:kalIdVon(x.closer), datum:x.datum, grund:x.grund||null, von_name:x.von||null
      },{onConflict:"kalender_id,datum"}).then(function(r){ if(r.error) throw r.error; jetzt(); });
    },
    delSperr:function(id){
      var teile=String(id).split("-");
      return sb.from("sperrtage").delete().eq("id",id).then(function(r){ if(r.error) throw r.error; jetzt(); });
    },
    kalenderAnlegen:function(name,st){
      return sb.from("kalender").insert({ name:name, start_strasse:st.strasse||null, start_plz:st.plz||null, start_ort:st.ort||null })
        .select("id").single().then(function(r){ if(r.error) throw r.error; return r.data.id; });

        .eq("id",id).then(function(r){ if(r.error) throw r.error; jetzt(); });
    }
  };
}

/* ---------------- Push aufs Handy ---------------- */
var PUSH = {
  sw:null,
  moeglich:("serviceWorker" in navigator && "PushManager" in window && "Notification" in window),
  status:function(){
    if(!this.moeglich) return "geht nicht";
    if(!istHomescreen() && istApple()) return "homescreen";
    return Notification.permission;      // default, granted, denied
  },
  start:function(){
    if(!this.moeglich) return Promise.resolve(null);
    var self=this;
    return navigator.serviceWorker.register("sw.js").then(function(reg){
      self.sw=reg;
      navigator.serviceWorker.addEventListener("message",function(e){
        if(e.data&&e.data.art==="termin-oeffnen"&&e.data.id) setTimeout(function(){ openAppt(e.data.id); },300);
      });
      return reg;
    }).catch(function(){ return null; });
  },
  anmelden:function(){
    var self=this;
    if(!this.moeglich) return Promise.reject(new Error("Dieses Gerät kann keine Mitteilungen."));
    return Notification.requestPermission().then(function(p){
      if(p!=="granted") throw new Error("Du hast Mitteilungen abgelehnt. Das änderst du in den Einstellungen des Handys.");
      return self.sw || self.start();
    }).then(function(reg){
      if(!reg) throw new Error("Der Hintergrunddienst startet nicht.");
      return reg.pushManager.getSubscription().then(function(vorhanden){
        if(vorhanden) return vorhanden;
        if(!PUSH_KEY) throw new Error("Es ist noch kein Schlüssel hinterlegt. Siehe Anleitung push-einrichten.md.");
        return reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ZuBytes(PUSH_KEY) });
      });
    }).then(function(ab){
      var j=ab.toJSON();
      return sb.from("push_geraete").upsert({
        person_id:S.me.id,
        kalender_id:S.me.kalender_id||null,
        endpunkt:j.endpoint,
        p256dh:j.keys&&j.keys.p256dh,
        auth:j.keys&&j.keys.auth,
        geraet:navigator.userAgent.slice(0,180)
      },{ onConflict:"endpunkt" }).then(function(r){
        if(r.error) throw r.error;
        return true;
      });
    });
  },
  abmelden:function(){
    if(!this.sw) return Promise.resolve();
    return this.sw.pushManager.getSubscription().then(function(ab){
      if(!ab) return;
      var e=ab.endpoint;
      return ab.unsubscribe().then(function(){
        return sb.from("push_geraete").delete().eq("endpunkt",e);
      });
    });
  }
};
function istApple(){ return /iPad|iPhone|iPod/.test(navigator.userAgent||""); }
function istHomescreen(){
  return (window.navigator.standalone===true) ||
         (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches);
}
function b64ZuBytes(b64){
  var rein=(b64+"=".repeat((4-b64.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/");
  var roh=window.atob(rein), out=new Uint8Array(roh.length);
  for(var i=0;i<roh.length;i++) out[i]=roh.charCodeAt(i);
  return out;
}

function setDiag(t,bad){

function tagesAnfahrt(a){
  var tag=S.appts.filter(function(x){ return x.datum===a.datum&&x.closer===a.closer; });
  var m=anfahrten(tag);
  return { min:m[a.id], von:m[a.id+"_von"] };
}
function pgText(a){
  var g=a&&a.pflegegrad;
  if(!g) return "PG ?";
  if(g==="antrag") return "Erstantrag";
  if(g==="kein") return "kein PG";
  return "PG "+g;
}
function nebenInfo(a,anfahrtMin){
  var teile=[];
  if(a.pflegegrad) teile.push(pgText(a));
  var f=(anfahrtMin===undefined)?abBasis(a):anfahrtMin;
  if(f!=null) teile.push("🚗 "+minText(f));
  return teile.join(" · ");
}
function kurzOrt(a,anfahrtMin){
  var teile=[];
  if(a.pflegegrad) teile.push(pgText(a));
  if(a.ort) teile.push(a.ort);
  var f=(anfahrtMin===undefined)?abBasis(a):anfahrtMin;
  if(f!=null) teile.push("🚗 "+minText(f));
  var mehrere=closers().length>1&&S.filterCloser==="alle";
  if(mehrere&&a.closer) teile.push(a.closer);
  return teile.join(" · ");
}
function kmZwischen(a,b){
  var R=6371, r=Math.PI/180;
  var dLat=(b[0]-a[0])*r, dLon=(b[1]-a[1])*r;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+
        Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
// Minuten von einer PLZ zur nächsten, geschätzt
function fahrMin(plzA,ortA,plzB,ortB){
  var a=koord(plzA,ortA), b=koord(plzB,ortB);
  if(!a||!b) return null;                       // unbekannte PLZ: lieber nichts behaupten
  var km=kmZwischen(a,b)*FAHRT.umweg;
  if(km<1) return FAHRT.puffer;
  var v = km<5 ? 25 : (km<20 ? 40 : 65);
  return Math.round(km/v*60)+FAHRT.puffer;
}
function startPunkt(closerName){
  var c=S.team.filter(function(m){ return m.rolle==="closer"&&m.name===closerName; })[0];
  if(c&&(c.startPlz||c.startOrt)){
    var k=koord(c.startPlz,c.startOrt);
    if(k) return {
      koord:k,
      text:(c.startOrt||c.startPlz),
      voll:[c.startStrasse,[c.startPlz,c.startOrt].filter(Boolean).join(" ")].filter(Boolean).join(", ")
    };
  }
  return { koord:BASIS, text:"Hannover Mitte", voll:"Hannover Mitte" };
}
function fahrVonStart(closerName,plzB,ortB){
  var b=koord(plzB,ortB); if(!b) return null;
  var km=kmZwischen(startPunkt(closerName).koord,b)*FAHRT.umweg;
  var v = km<5 ? 25 : (km<20 ? 40 : 65);
  return Math.round(km/v*60)+FAHRT.puffer;
}
function minText(m){
  if(m==null) return "?";
  return m>=60 ? Math.floor(m/60)+" Std "+(m%60?(m%60)+" Min":"") : m+" Min";
}
// Prüft, ob der Closer es rechtzeitig hin und danach weiter schafft
function fahrtPruefung(datum,closer,vonMin,dauer,plzNeu,ortNeu,ausserId){
  var tag=S.appts.filter(function(x){
    return x.datum===datum&&x.closer===closer&&x.status!=="abgesagt"&&x.id!==ausserId;
  }).sort(function(a,b){ return zeitInMin(a.zeit)-zeitInMin(b.zeit); });

  var bis=vonMin+dauer, meldungen=[], eng=false;
  var davor=null, danach=null;
  tag.forEach(function(x){
    var xv=zeitInMin(x.zeit), xb=xv+(+x.dauer||60);
    if(xb<=vonMin && (!davor||xb>zeitInMin(davor.zeit)+(+davor.dauer||60))) davor=x;
    if(xv>=bis && (!danach||xv<zeitInMin(danach.zeit))) danach=x;
  });

  var unklar=[];
  if(!koord(plzNeu,ortNeu)) unklar.push("dieser Adresse (PLZ "+(plzNeu||"fehlt")+")");
  if(davor&&!koord(davor.plz,davor.ort)) unklar.push(name(davor)+" (PLZ "+(davor.plz||"fehlt")+")");
  if(danach&&!koord(danach.plz,danach.ort)) unklar.push(name(danach)+" (PLZ "+(danach.plz||"fehlt")+")");

  if(davor){
    var f=fahrMin(davor.plz,davor.ort,plzNeu,ortNeu);
    if(f!=null){
      var ende=zeitInMin(davor.zeit)+(+davor.dauer||60), ankunft=ende+f;
      if(ankunft>vonMin){
        eng=true;
        meldungen.push("Davor "+name(davor)+" in "+(davor.ort||davor.plz||"?")+" bis "+
          pad(Math.floor(ende/60))+":"+pad(ende%60)+". Fahrt "+minText(f)+
          ", er wäre erst "+pad(Math.floor(ankunft/60))+":"+pad(ankunft%60)+" da.");
      } else {
        meldungen.push("Nach "+name(davor)+" sind es "+minText(f)+" Fahrt, das passt.");
      }
    }
  } else {
    var fb=fahrVonStart(closer,plzNeu,ortNeu);
    if(fb!=null) meldungen.push("Von "+startPunkt(closer).text+" rund "+minText(fb)+" Fahrt.");
  }

  if(danach){
    var f2=fahrMin(plzNeu,ortNeu,danach.plz,danach.ort);
    if(f2!=null){
      var los=bis+f2, beginn=zeitInMin(danach.zeit);
      if(los>beginn){
        eng=true;
        meldungen.push("Danach "+name(danach)+" in "+(danach.ort||danach.plz||"?")+" um "+
          esc(danach.zeit)+". Fahrt "+minText(f2)+", er käme "+(los-beginn)+" Min zu spät.");
      }
    }
  }
  return { eng:eng, meldungen:meldungen, unklar:unklar };
}

function claudeDb(){
  if(!sb){ setDiag("Supabase konnte nicht geladen werden. Internetverbindung prüfen.",true); return; }
  store=sbStore(); S.offline=false;
  sb.auth.getSession().then(function(r){
    var sess=r&&r.data&&r.data.session;
    connect();
    if(sess) nachAnmeldung(sess.user);
  });
  beobachten(sb);
}

// Nach erfolgreicher Anmeldung die eigene Personenzeile holen
function nachAnmeldung(user){
  sb.from("personen").select("*").eq("id",user.id).maybeSingle().then(function(r){
    if(r.error||!r.data){
      setDiag("Dieser Zugang ist noch keinem Kalender zugeordnet. Melde dich beim Admin.",true);
      return;
    }
    return sb.from("kalender").select("*").then(function(k){
      KAL={}; KAL_ID={};
      (k.data||[]).forEach(function(x){ KAL[x.id]=x; KAL_ID[x.name]=x.id; });
      var m=personAusDb(r.data);
      m.benutzer=benutzerAus(user.email);
      S.me=m;
      enterApp();
      if(store&&store.onTeam) setTimeout(function(){ render(); },500);
    });
  });
}

function connect(){
  S.ready=true;
  store.onTeam(function(list){
    S.team=sortTeam(list);
    if(S.me){
      var m=S.team.filter(function(x){ return x.id===S.me.id; })[0];
      if(m) S.me=m;
      else if(S.team.length){
        LS.del("sb_me"); S.me=null; closeOverlay();
        $("app").hidden=true; $("untenleiste").hidden=true; $("gate").hidden=false;
        toast("Du wurdest aus dem Team entfernt.");
      }
    }
    // Nur zeichnen, wenn sich am Team wirklich etwas geändert hat, sonst flackert das Panel
    var sig=S.team.map(function(m){ return m.id+":"+m.name+":"+m.rolle+":"+(m.benutzer||"")+":"+(m.gehoertZu||"")+":"+(m.startPlz||""); }).join("|");
    if(sig===S.teamSig) return;
    S.teamSig=sig;
    renderGate(); renderFilter(); render();
    if(!S.offline) setDiag("Verbunden. "+S.team.length+" im Team, "+S.appts.length+" Termine gespeichert.");
    if(document.querySelector('[data-overlay="who"]') && !document.querySelector(".confirm") && !S.neuerZugang) openWho();
  });
  if(store.onSperr) store.onSperr(function(list){ S.sperr=list; render(); });
  store.onAppts(function(list){
    S.appts=list.sort(function(a,b){ return startMs(a)-startMs(b); });
    render();
  });
  store.onActivity(function(list){
    var prev=S.activity.length;
    S.activity=list.sort(function(a,b){ return b.ts-a.ts; }).slice(0,60);
    if(!S.firstFeed && S.activity.length>prev && S.me){
      var top=sichtbareEvents()[0];
      if(top && top.by!==S.me.name && top.ts>Date.now()-60000) toast(top.by+": "+top.text);
    }
    S.firstFeed=false;
    renderBell(); renderSide();
    if(document.querySelector('[data-overlay="feed"]')) openFeed(true);
  });

  renderBanner();

}

    (istCloser?'<button class="weg" data-go="zugaenge">Zugänge<small>Setter freischalten oder sperren</small></button>':'')+
  '</div>';

  $("view-home").innerHTML=html;
  Array.prototype.forEach.call($("view-home").querySelectorAll("[data-go]"),function(b){
    b.onclick=function(){
      var z=b.dataset.go;
      if(z==="zahlen"){ S.view="numbers"; render(); return; }
      if(z==="zugaenge"){ openWho(); return; }
      if(z==="heute"){ S.view="heute"; render(); return; }
      if(z==="frei"){ openSperren(); return; }
      S.filterCloser=(z==="meine"?"meine":"alle");
      S.view="week"; renderFilter(); render();
    };
  });
}

function renderHeute(){
  var heute=ymd(new Date());
  var tage=erlaubteTermine().filter(function(a){ return a.datum>=heute&&a.status!=="abgesagt"; })
    .sort(function(a,b){ return startMs(a)-startMs(b); });
  var tag=tage.length?tage[0].datum:heute;
  var liste=tage.filter(function(a){ return a.datum===tag; });
  var d=parseYmd(tag), anf=anfahrten(liste);
  var fahrt=0, hatFahrt=false;
  liste.forEach(function(a){ if(anf[a.id]!=null){ fahrt+=anf[a.id]; hatFahrt=true; } });
  var zurueck=liste.length?fahrVonStart(liste[liste.length-1].closer,liste[liste.length-1].plz,liste[liste.length-1].ort):null;
  if(zurueck!=null) fahrt+=zurueck;

  var html='<div class="hallo"><h2>'+(tag===heute?"Heute":DOW[(d.getDay()+6)%7])+', '+deDate(d)+'</h2>'+
    '<p>'+(liste.length
      ? liste.length+(liste.length===1?" Termin":" Termine")+(hatFahrt?" · rund "+minText(fahrt)+" Fahrt, hin und zurück":"")
      : "Keine Termine mehr geplant.")+'</p></div>';

  if(!liste.length){
    html+='<div class="banner"><span>📭</span><div>Kein offener Termin. Über <b>Termin setzen</b> trägst du den nächsten ein.</div></div>';
  } else {
    html+='<div class="tagesliste">'+liste.map(function(a,i){
      var tel=String(a.telefon||"").replace(/[^0-9+]/g,"");
      var adr=adresseEineZeile(a);
      var st=STATUS[a.status]||STATUS.geplant;
      return '<div class="tagkarte" style="--st:'+st.color+'">'+
        '<div class="kopfzeile">'+
          '<span class="mono zeit">'+esc(a.zeit)+' bis '+esc(endeVon(a))+'</span>'+
          '<span class="pill '+esc(a.status)+'">'+esc(st.label)+'</span>'+
        '</div>'+
        '<button class="tagname" data-id="'+esc(a.id)+'">'+esc(name(a))+'</button>'+
        '<div class="tagzeile">'+esc(pgText(a))+' · '+esc(adr||"keine Adresse")+
          (anf[a.id]!=null?' · 🚗 '+esc(minText(anf[a.id]))+' Anfahrt':'')+'</div>'+
        (a.hinweise&&a.hinweise.length?'<div class="hinweise" style="margin-top:2px">'+
          a.hinweise.slice(0,4).map(function(h){ return '<span class="marke">'+esc(h)+'</span>'; }).join("")+'</div>':'')+
        '<div class="callrow" style="margin-top:9px">'+
          (adr?'<a class="haupt" href="'+esc(routeLink(adr))+'" target="_blank" rel="noopener">🚗 Losfahren</a>':'')+
          (tel?'<a href="tel:'+esc(tel)+'">📞 Anrufen</a>':'')+
          '<a href="#" data-oeffnen="'+esc(a.id)+'">Ergebnis</a>'+
        '</div>'+
      '</div>';
    }).join("")+'</div>';
  }

  $("view-heute").innerHTML=html;
  Array.prototype.forEach.call($("view-heute").querySelectorAll("[data-id],[data-oeffnen]"),function(b){
    b.onclick=function(e){ e.preventDefault(); openAppt(b.dataset.id||b.dataset.oeffnen); };
  });
}

/* Tag, Woche oder Monat. Die Wahl bleibt auf dem Geraet gespeichert. */
function modus(){
  if(!S.kalModus){
    var g=null;
    try{ g=localStorage.getItem("sb_kalmodus"); }catch(e){}
    S.kalModus = (g==="tag"||g==="woche"||g==="monat") ? g
      : (window.matchMedia("(max-width:899px)").matches ? "tag" : "woche");
  }
  return S.kalModus;
}
function setModus(m){
  S.kalModus=m;
  try{ localStorage.setItem("sb_kalmodus",m); }catch(e){}
  render();
}
function monatsAnker(){ var d=parseYmd(S.tag); return new Date(d.getFullYear(),d.getMonth(),1); }
var MONATE=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function renderWeek(){
  var start=S.weekStart, m=modus();
  var heuteYmd=ymd(new Date());
  // Umschalter und Beschriftung der Leiste
  Array.prototype.forEach.call($("modusBar").querySelectorAll("button"),function(b){
    b.setAttribute("aria-pressed",String(b.dataset.m===m));
  });
  var tagD=parseYmd(S.tag);
  var eng=window.matchMedia("(max-width:899px)").matches;
  if(m==="tag"){
    $("weekTitle").textContent=(eng?DOW_S[(tagD.getDay()+6)%7]:DOW[(tagD.getDay()+6)%7])+", "+deDate(tagD);
    $("weekRange").textContent="";
  } else if(m==="monat"){
    var ma=monatsAnker();
    $("weekTitle").textContent=MONATE[ma.getMonth()]+" "+ma.getFullYear();
    $("weekRange").textContent="";
  } else {
    $("weekTitle").textContent="KW "+isoWeek(start);
    $("weekRange").textContent=deDate(start)+" bis "+deDate(addDays(start,5));
  }
  $("weekStart").textContent="";
  var amHeute = (m==="tag") ? (S.tag===heuteYmd)
    : (m==="woche") ? (ymd(S.weekStart)<=heuteYmd && heuteYmd<=ymd(addDays(S.weekStart,6)))
    : (monatsAnker().getMonth()===new Date().getMonth() && monatsAnker().getFullYear()===new Date().getFullYear());
  $("heuteBtn").hidden=amHeute;
  var today=heuteYmd, list=visible(), html="";
  for(var i=0;i<6;i++){
    var d=addDays(start,i), key=ymd(d);
    var day=list.filter(function(a){ return a.datum===key; });
    html+='<div class="day'+(key===today?" today":"")+(day.length?"":" empty-mobile")+'">'+
      '<div class="day-head"><span class="dow">'+DOW_S[i]+'</span><span class="dnum mono">'+pad(d.getDate())+"."+pad(d.getMonth()+1)+'</span></div>'+
      (day.length?'<div class="day-body">'+(function(){ var an=anfahrten(day); return day.map(function(x){ return cardHtml(x,an[x.id]); }).join(""); })()+'</div>':'<div class="day-empty">frei</div>')+
    '</div>';
  }
  $("weekGrid").innerHTML=html;
  var leer=!list.length;
  var hinweis=$("leerHinweis");
  if(!hinweis){
    hinweis=document.createElement("div");
    hinweis.id="leerHinweis";
    hinweis.className="banner";
    hinweis.style.marginBottom="12px";
    var wrap=document.querySelector(".weekmain");
    if(wrap) wrap.insertBefore(hinweis,wrap.firstChild);
  }
  if(leer){
    var gefiltert=S.filterCloser!=="alle";
    var wer=S.filterCloser==="meine"?"Nur deine Termine":S.filterCloser;
    hinweis.hidden=false;
    hinweis.innerHTML='<span>📭</span><div>'+
      (gefiltert
        ? '<b>'+esc(wer)+'</b> hat hier keine Termine. '+
          '<button class="btn ghost" id="alleZeigen" style="padding:2px 8px">Alle anzeigen</button>'
        : '<b>Noch keine Termine.</b> Über <b>Termin setzen</b> trägst du den ersten ein.')+
      '</div>';
    var az=$("alleZeigen");
    if(az) az.onclick=function(){ S.filterCloser="alle"; renderFilter(); render(); };
  } else hinweis.hidden=true;
  Array.prototype.forEach.call($("weekGrid").querySelectorAll(".card"),function(b){
    b.onclick=function(){ openAppt(b.dataset.id); };
  });
  var cal=$("calGrid");
  if(cal) cal.className="cal"+(m==="woche"?" wochenmodus":"");
  if(m==="tag") renderTagRaster();
  else if(m==="monat") renderMonat(list,today);
  else renderRaster(start,list,today);
}

/* Zeitraster: Achse links, Termine an ihrer Uhrzeit */
function renderTagRaster(){
  var box=$("calGrid"); if(!box) return;
  var d=parseYmd(S.tag), heute=ymd(new Date());
  var liste=visible().filter(function(a){ return a.datum===S.tag; })
    .sort(function(a,b){ return startMs(a)-startMs(b); });
  var anf=anfahrten(liste);
  var VON=RULES.openHour-1, BIS=RULES.closeHour+2, H=64, hoehe=(BIS-VON)*H;

  var kopf='<div class="tagkopf">'+
    '<button class="tagnav" id="tagZurueck">‹</button>'+
    '<div class="tagtitel"><b>'+DOW[(d.getDay()+6)%7]+'</b><span>'+deDate(d)+(S.tag===heute?" · heute":"")+'</span></div>'+
    '<button class="tagnav" id="tagVor">›</button>'+
  '</div>';

  var achse='<div class="axis" style="height:'+hoehe+'px">';
  for(var h=VON;h<=BIS;h++){
    achse+='<div class="tick '+((h%2===0)?"major":"minor")+'" style="top:'+((h-VON)*H+3)+'px">'+pad(h)+'<span style="opacity:.55">:00</span></div>';
  }
  achse+='</div>';

  var inhalt="";
  liste.forEach(function(a){
    if(a.status==="abgesagt") return;
    var f=anf[a.id];
    var von=zeitInMin(a.zeit), dauer=(+a.dauer||60);
    if(f!=null&&f>=6){
      var topF=(von-f-VON*60)/60*H, hF=f/60*H;
      if(topF<0){ hF+=topF; topF=0; }
      if(hF>=6) inhalt+='<div class="fahrt" style="top:'+topF+'px;height:'+hF+'px"><span>'+esc(minText(f))+'</span></div>';
    }
    var top=(von-VON*60)/60*H, hh=Math.max(30,dauer/60*H-3);
    var st=STATUS[a.status]||STATUS.geplant;
    inhalt+='<button class="tblock gross st-'+esc(a.status)+'" data-id="'+esc(a.id)+'" '+
      'style="top:'+top+'px;height:'+hh+'px;left:3px;right:3px;--st:'+st.color+'">'+
      '<span class="stapel">'+
        '<span class="z">'+esc(a.zeit)+' bis '+esc(endeVon(a))+'</span>'+
        '<span class="n gross">'+esc(name(a))+'</span>'+
        (a.ort?'<span class="ort">'+esc(a.ort)+'</span>':'')+
        (hh>92?'<span class="u">'+esc(nebenInfo(a,f))+'</span>':'')+
      '</span></button>';
  });
  if(S.tag===heute){
    var n=new Date(), min=n.getHours()*60+n.getMinutes();
    if(min>=VON*60&&min<=BIS*60) inhalt+='<div class="jetzt" style="top:'+((min-VON*60)/60*H)+'px"></div>';
  }

  box.innerHTML=kopf+'<div class="calbody tagbody">'+achse+
    '<div class="daycol" style="height:'+hoehe+'px">'+inhalt+'</div></div>';
  $("tagZurueck").onclick=function(){ S.tag=ymd(addDays(parseYmd(S.tag),-1)); S.weekStart=mondayOf(parseYmd(S.tag)); render(); };
  $("tagVor").onclick=function(){ S.tag=ymd(addDays(parseYmd(S.tag),1)); S.weekStart=mondayOf(parseYmd(S.tag)); render(); };
  Array.prototype.forEach.call(box.querySelectorAll(".tblock"),function(b){
    b.onclick=function(){ openAppt(b.dataset.id); };
  });
}

/* Monat: Gitter mit allen Tagen, Tippen springt in den Tag */
function renderMonat(list,today){
  var box=$("calGrid"); if(!box) return;
  var erster=monatsAnker(), monat=erster.getMonth();
  var start=mondayOf(erster);
  var breit=window.matchMedia("(min-width:900px)").matches;
  var maxZeilen=breit?3:0;               // auf dem Handy nur Punkte, sonst Zeilen
  var cName=meinCloser();

  var kopf='<div class="monkopf">'+["Mo","Di","Mi","Do","Fr","Sa","So"].map(function(t){
    return '<div>'+t+'</div>'; }).join("")+'</div>';

  var zellen="", d=new Date(start);
  for(var i=0;i<42;i++){
    var key=ymd(d);
    var tagL=list.filter(function(a){ return a.datum===key&&a.status!=="abgesagt"; })
                 .sort(function(a,b){ return startMs(a)-startMs(b); });
    var sp=cName?gesperrt(key,cName):null;
    var inhalt="";
    if(maxZeilen){
      inhalt=tagL.slice(0,maxZeilen).map(function(a){
        var st=STATUS[a.status]||STATUS.geplant;
        return '<span class="mzeile" style="--st:'+st.color+'"><b>'+esc(a.zeit)+'</b><span>'+esc(name(a))+'</span></span>';
      }).join("");
      if(tagL.length>maxZeilen) inhalt+='<span class="mmehr">+'+(tagL.length-maxZeilen)+' weitere</span>';
    } else if(tagL.length){
      inhalt='<span class="mpunkte">'+tagL.slice(0,6).map(function(a){
        var st=STATUS[a.status]||STATUS.geplant;
        return '<i style="--st:'+st.color+'"></i>'; }).join("")+'</span>';
    }
    zellen+='<button class="montag'+(d.getMonth()!==monat?" fremd":"")+(key===today?" heute":"")+(sp?" gesperrt":"")+'" '+
      'data-tag="'+key+'"'+(sp?' title="'+esc(sp.grund||"nicht da")+'"':'')+'>'+
      '<span class="mzahl">'+d.getDate()+'</span>'+inhalt+'</button>';
    d=addDays(d,1);
    if(i>=34&&d.getMonth()!==monat&&(i+1)%7===0) break;   // letzte leere Zeile weglassen
  }

  box.innerHTML=kopf+'<div class="mongrid">'+zellen+'</div>';
  Array.prototype.forEach.call(box.querySelectorAll(".montag"),function(b){
    b.onclick=function(){
      S.tag=b.dataset.tag;
      S.weekStart=mondayOf(parseYmd(S.tag));
      setModus("tag");
    };
  });
}

function renderRaster(start,list,today){
  var box=$("calGrid"); if(!box) return;
  var VON=RULES.openHour-1, BIS=RULES.closeHour+2;   // etwas Luft ober- und unterhalb
  var H=58, hoehe=(BIS-VON)*H;

  function tagesFahrt(liste){
    if(!liste.length) return null;
    var summe=0, ok=false, vor=null;
    liste.forEach(function(a){
      var f = vor ? fahrMin(vor.plz,vor.ort,a.plz,a.ort) : fahrVonStart(a.closer,a.plz,a.ort);
      if(f!=null){ summe+=f; ok=true; }
      vor=a;
    });
    var zurueck=vor?fahrVonStart(vor.closer,vor.plz,vor.ort):null;
    if(zurueck!=null) summe+=zurueck;
    return ok?summe:null;
  }

  var kopf='<div class="calhead"><div class="hc"></div>';
  for(var i=0;i<6;i++){
    var d=addDays(start,i), key=ymd(d);
    var tagL=list.filter(function(a){ return a.datum===key&&a.status!=="abgesagt"; })
                 .sort(function(a,b){ return startMs(a)-startMs(b); });
    var tf=tagesFahrt(tagL);
    kopf+='<div class="hc'+(key===today?" today":"")+'">'+
      '<span class="dow">'+DOW_S[i]+'</span><span class="dnum">'+pad(d.getDate())+"."+pad(d.getMonth()+1)+'</span>'+
      (tf!=null?'<span class="fahrt-tag" title="geschätzte Fahrzeit an dem Tag, hin und zurück">🚗 '+minText(tf)+'</span>':'')+
      '</div>';
  }
  kopf+='</div>';

  var achse='<div class="axis" style="height:'+hoehe+'px">';
  for(var h=VON;h<=BIS;h++){
    var gerade=(h%2===0);
    achse+='<div class="tick '+(gerade?"major":"minor")+'" style="top:'+((h-VON)*H+3)+'px">'+pad(h)+'<span style="opacity:.55">:00</span></div>';
  }
  achse+='</div>';

  var spalten="";
  for(var i2=0;i2<6;i2++){
    var d2=addDays(start,i2), key2=ymd(d2);
    var tag=list.filter(function(a){ return a.datum===key2; })
                .sort(function(a,b){ return startMs(a)-startMs(b); });
    var inhalt="", anf=anfahrten(tag);
    // Anfahrt als grauer Streifen vor dem Termin
    tag.forEach(function(a){
      if(a.status==="abgesagt") { return; }
      var f=anf[a.id];
      if(f==null||f<6) return;
      var von=zeitInMin(a.zeit);
      var topF=(von-f-VON*60)/60*H, hF=f/60*H;
      if(topF<0){ hF+=topF; topF=0; }
      if(hF<6) return;
      inhalt+='<div class="fahrt" style="top:'+topF+'px;height:'+hF+'px" title="Anfahrt '+esc(minText(f))+'">'+
        (hF>17?'<span>'+esc(minText(f))+'</span>':'')+'</div>';
    });
    // Ueberlappende Termine nebeneinander legen
    var spur=[], spurVon={};
    tag.forEach(function(a){
      var von=zeitInMin(a.zeit), bis=von+(+a.dauer||60), i3=0;
      while(spur[i3]!=null && spur[i3]>von) i3++;
      spur[i3]=bis; spurVon[a.id]=i3;
    });
    var spuren=Math.max(1,spur.length);
    tag.forEach(function(a){
      var von=zeitInMin(a.zeit), dauer=(+a.dauer||60);
      var top=(von-VON*60)/60*H, hh=Math.max(26,dauer/60*H-3);
      var breite=100/spuren, links=(spurVon[a.id]||0)*breite;
      var st=STATUS[a.status]||STATUS.geplant;
      var mittel=hh>=44, gross=hh>=76, sehrGross=hh>=118;
      var adr=[a.strasse,[a.plz,a.ort].filter(Boolean).join(" ")].filter(Boolean).join(", ");
      inhalt+='<button class="tblock st-'+esc(a.status)+(gross?" gross":"")+'" data-id="'+esc(a.id)+'" '+
        'style="top:'+top+'px;height:'+hh+'px;left:calc('+links+'% + 3px);width:calc('+breite+'% - 6px);--st:'+st.color+'">'+
        '<span class="stapel">'+
          (gross
            ? '<span class="z">'+esc(a.zeit)+' bis '+esc(endeVon(a))+' Uhr</span>'+
              '<span class="n gross">'+esc(name(a))+'</span>'
            : '<span class="n"><span class="z">'+esc(a.zeit)+'</span> '+esc(name(a))+'</span>')+
          (mittel&&a.ort?'<span class="ort">'+esc(a.ort)+'</span>':'')+
          (mittel?'<span class="u">'+esc(nebenInfo(a,anf[a.id]))+'</span>':'')+
          (gross&&a.strasse?'<span class="u">'+esc(a.strasse)+'</span>':'')+
          (gross&&a.telefon?'<span class="u mono">'+esc(a.telefon)+'</span>':'')+
          (gross&&a.hinweise&&a.hinweise.length?
            '<span class="tmarken">'+a.hinweise.slice(0,sehrGross?6:3).map(function(h){
              return '<span>'+esc(h)+'</span>'; }).join("")+'</span>':'')+
          (sehrGross&&a.notiz?'<span class="u tnotiz">'+esc(a.notiz)+'</span>':'')+
        '</span>'+
      '</button>';
    });
    var jetzt="";
    if(key2===today){
      var n=new Date(), min=n.getHours()*60+n.getMinutes();
      if(min>=VON*60&&min<=BIS*60) jetzt='<div class="jetzt" style="top:'+((min-VON*60)/60*H)+'px"></div>';
    }
    var spK=meinCloser()?gesperrt(key2,meinCloser()):null;
    spalten+='<div class="daycol'+(tag.length?"":" frei")+(spK?" gesperrt":"")+'" style="height:'+hoehe+'px" '+
      (spK?'title="'+esc(spK.grund||"nicht da")+'"':'')+'>'+inhalt+jetzt+
      (spK?'<div class="sperrband"><span>'+esc(spK.grund||"nicht da")+'</span></div>':'')+'</div>';
  }

  box.innerHTML='<div class="calscroll"><div class="calinner">'+kopf+
    '<div class="calbody">'+achse+spalten+'</div></div></div>';
  Array.prototype.forEach.call(box.querySelectorAll(".tblock"),function(b){
    b.onclick=function(){ openAppt(b.dataset.id); };
  });
}

function endeVon(a){ var m=zeitInMin(a.zeit)+(+a.dauer||60); return pad(Math.floor(m/60))+":"+pad(m%60); }
function zeitInMin(t){ var p=String(t||"0:00").split(":"); return (+p[0])*60+(+p[1]||0); }

function cardHtml(a,anfahrtMin){
  var st=STATUS[a.status]||STATUS.geplant;
  return '<button class="card" data-id="'+esc(a.id)+'" style="--st:'+st.color+'">'+
    '<span class="t mono">'+esc(a.zeit)+' bis '+esc(endeVon(a))+' · '+esc(a.closer)+'</span>'+
    '<span class="k">'+esc(name(a))+'</span>'+
    (a.ort?'<span class="kort">'+esc(a.ort)+'</span>':'')+
    '<span class="m"><span class="pg">'+esc(pgText(a))+'</span>'+(anfahrtMin!=null?'🚗 '+esc(minText(anfahrtMin))+' Anfahrt · ':'')+'von '+esc(a.setter)+'</span>'+
    '<span class="pill '+esc(a.status)+'">'+esc(st.label)+'</span>'+
  '</button>';
}

/* ---------------- Zahlen ---------------- */
function renderNumbers(){
  var von=ymd(S.weekStart), bis=ymd(addDays(S.weekStart,6));
  var istCloser=S.me.rolle==="closer";
  var basis=erlaubteTermine().filter(function(a){
    if(a.datum<von||a.datum>bis) return false;
    return istCloser ? true : a.setter===S.me.name;      // Setter sieht nur die eigenen
  });
  var bewertet=basis.filter(function(a){ return a.status!=="geplant"&&a.status!=="abgesagt"; });
  var gehalten=basis.filter(function(a){ return GEHALTEN[a.status]; });
  var ausgefallen=basis.filter(function(a){ return a.status==="nichtda"; });
  var folge=basis.filter(function(a){ return a.status==="folgetermin"; });
  var offen=basis.filter(function(a){ return a.status==="geplant"; });

  var html='<div class="weekbar"><div class="nav">'+
    '<button id="prevW2" title="Woche zurück">‹</button><button id="nextW2" title="Woche vor">›</button></div>'+
    '<h2>'+(istCloser?"Dein Kalender":"Deine Zahlen")+'</h2>'+

  $("view-numbers").innerHTML=html;
  $("prevW2").onclick=function(){ S.weekStart=addDays(S.weekStart,-7); render(); };
  $("nextW2").onclick=function(){ S.weekStart=addDays(S.weekStart,7); render(); };
}

/* ---------------- overlays ---------------- */
function closeOverlay(){ $("overlays").innerHTML=""; document.body.style.overflow=""; }
function overlay(title,bodyHtml,footHtml,tag){
  document.body.style.overflow="hidden";
  $("overlays").innerHTML=
    '<button class="scrim" id="scrim" aria-label="Schließen"></button>'+
    '<aside class="panel" data-overlay="'+esc(tag||"x")+'" role="dialog" aria-modal="true">'+
      '<div class="panel-head"><h3>'+esc(title)+'</h3><button class="x" id="closeOv" aria-label="Schließen">✕</button></div>'+
      '<div class="panel-body">'+bodyHtml+'</div>'+
      (footHtml?'<div class="panel-foot">'+footHtml+'</div>':'')+
    '</aside>';
  $("scrim").onclick=closeOverlay;
  $("closeOv").onclick=closeOverlay;

  var panel=document.querySelector(".panel");
  if(panel&&window.innerWidth>700){
    var gespeichert=parseInt(LS.get("sb_panelw")||"0",10);
    if(gespeichert>300) panel.style.width=Math.min(gespeichert,window.innerWidth-60)+"px";
    var griff=document.createElement("div");
    griff.className="griff";
    griff.title="Breite ziehen, Doppelklick setzt zurück";
    griff.addEventListener("mousedown",function(e){ zugStart(e.clientX,panel,griff); e.preventDefault(); });
    griff.addEventListener("touchstart",function(e){ zugStart(e.touches[0].clientX,panel,griff); },{passive:true});
    griff.addEventListener("dblclick",function(){
      panel.style.width=""; LS.del("sb_panelw");
    });
    panel.appendChild(griff);
  }
}

/* Panel in der Breite ziehen */
var ZUG={aktiv:false,x:0,w:0,panel:null,griff:null};
function zugStart(x,panel,griff){
  ZUG.aktiv=true; ZUG.x=x; ZUG.w=panel.getBoundingClientRect().width;
  ZUG.panel=panel; ZUG.griff=griff;
  griff.classList.add("zieht");
  document.body.style.userSelect="none";
}
function zugZieh(x){
  if(!ZUG.aktiv) return;
  var w=ZUG.w+(ZUG.x-x);
  w=Math.max(330,Math.min(window.innerWidth-60,w));
  ZUG.panel.style.width=w+"px";
}
function zugEnde(){
  if(!ZUG.aktiv) return;
  ZUG.aktiv=false;
  document.body.style.userSelect="";
  if(ZUG.griff) ZUG.griff.classList.remove("zieht");
  if(ZUG.panel) LS.set("sb_panelw",String(Math.round(ZUG.panel.getBoundingClientRect().width)));
}

function openForm(edit){
  var meinC=meinCloser();
  var cs=meinC?[{name:meinC}]:[];

      '<p class="hint">Dir ist noch kein Kalender zugeordnet. Dein Closer muss dir einen Zugang geben, dann kannst du Termine eintragen.</p>',
      '<button class="btn ghost" id="qc_abort">Schließen</button>',"form");
    $("qc_abort").onclick=closeOverlay;
    return;
  }

  var a=edit||{};
  var startCloser=meinC;
  function freieAmTag(tag,closer){
    var belegt={}, anzahl=0;
    S.appts.forEach(function(x){
      if(x.datum===tag&&x.closer===closer&&x.status!=="abgesagt"&&x.id!==a.id){ belegt[x.zeit]=1; anzahl++; }
    });
    if(anzahl>=RULES.maxPerDay) return 0;
    var d=parseYmd(tag), minMs=Date.now()+RULES.leadHours*3600*1000, frei=0;
    for(var h=RULES.openHour;h<=RULES.closeHour;h++){
      var t=pad(h)+":00";
      if(!belegt[t] && new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,0).getTime()>=minMs) frei++;
    }
    return frei;
  }
  function ersterFreierTag(){
    var d=new Date();
    for(var i=0;i<21;i++){
      var tag=ymd(addDays(d,i));

      if(freieAmTag(tag,startCloser)>0) return tag;
    }
    return ymd(new Date());

      '<span class="hint" id="telHint"></span></div>'+
    '<div class="field"><label for="f_adr">Adresse</label>'+

    '<hr class="sep">'+
    '<div class="sec-label" style="margin-bottom:2px">Wann passt es dem Kunden?</div>'+
    '<div class="two">'+
      '<div class="field"><label for="f_datum">Datum</label><input type="date" id="f_datum" class="mono" value="'+esc(sel.datum)+'"></div>'+
      '<div class="field"><label for="f_zeit">Beginn</label><input type="time" id="f_zeit" class="mono" step="900" value="'+esc(a.zeit||"")+'"></div>'+

         '<option value="antrag"'+(String(a.pflegegrad)==="antrag"?" selected":"")+'>Erstantrag läuft</option>']

  var schritt=1;

  }

  function adrJetzt(){ return adresseZerlegen($("f_adr").value); }
  function plzCheck(){
    var ad=adrJetzt(), h=$("plzHint");
    if(!h) return;
    if(!ad.strasse&&!ad.plz&&!ad.ort){ h.textContent=""; h.style.color=""; return; }
    var teile=[];
    if(ad.strasse) teile.push(ad.strasse);
    if(ad.plz) teile.push(ad.plz);
    if(ad.ort) teile.push(ad.ort);
    if(ad.plz&&PLZ[ad.plz]){ h.textContent="Erkannt: "+teile.join(" · "); h.style.color="var(--ok)"; }
    else if(ad.ort&&ORTE[normOrt(ad.ort)]){ h.textContent="Erkannt: "+teile.join(" · ")+". PLZ unbekannt, ich rechne mit "+ad.ort+"."; h.style.color="var(--warn)"; }
    else if(ad.plz){ h.textContent="PLZ "+ad.plz+" gibt es so nicht. Bitte prüfen, sonst fehlt die Fahrzeit."; h.style.color="var(--bad)"; }
    else { h.textContent="Erkannt: "+teile.join(" · ")+". Ohne PLZ kann ich die Fahrzeit nicht rechnen."; h.style.color="var(--warn)"; }

  function quali(){
    var pg=$("f_pg").value, wohn=$("f_wohn").value, box=$("qualiBox"), out="";

        'Der Einbau wird erst nach dem Bescheid abgerechnet.</div>';

    if(pg==="kein"){
      out='<div class="stop"><b>Kein Termin, Wiedervorlage</b>Ohne Pflegegrad gibt es keine Kostenübernahme nach § 40 SGB XI. '+
        'Erst Pflegegrad beantragen lassen, bis zum Bescheid vergehen rund fünf Wochen. Danach zurückrufen, solche Leads sind oft langjährige Kunden.</div>';

      var xv=zeitInMin(x.zeit), xb=xv+(+x.dauer||60);
      if(von<xb&&xv<bis) treffer=x;
    });
    return treffer;
  }

  function drawZeiten(){
    sel.datum=$("f_datum").value||sel.datum;
    sel.closer=meinC;
    sel.dauer=+$("f_dauer").value||RULES.slotMin;
    sel.zeit=$("f_zeit").value||"";

    var d=parseYmd(sel.datum), minMs=Date.now()+RULES.leadHours*3600*1000;
    var _ad=adrJetzt(), plzJetzt=_ad.plz, ortJetzt=_ad.ort;
    var html="", frei=0;
    for(var m=RULES.openHour*60; m+sel.dauer<=(RULES.closeHour+1)*60; m+=30){
      var t=zeitText(m), k=konflikt(sel.datum,sel.closer,m,sel.dauer);
      var ms=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(m/60),m%60).getTime();
      var spaet=ms<minMs, blockiert=(k||spaet);
      var engT=!blockiert&&fahrtPruefung(sel.datum,sel.closer,m,sel.dauer,plzJetzt,ortJetzt,a.id).eng;
      if(!blockiert) frei++;
      html+='<button class="slot'+(engT?" eng":"")+'" data-t="'+t+'"'+(blockiert?" disabled":"")+
        ' aria-pressed="'+(sel.zeit===t)+'" title="'+(k?esc("Belegt: "+name(k)):(spaet?"Zu kurzfristig":(engT?"Fahrzeit wird knapp":"")))+'">'+t+'</button>';
    }
    $("slotBox").innerHTML=html;
    $("slotHint").textContent = frei
      ? "Vorschläge im Halbstundentakt für "+sel.dauer+" Minuten. Jede andere Uhrzeit kannst du oben eintragen."
      : "An dem Tag passt nichts mehr in "+sel.dauer+" Minuten. Nimm den nächsten Tag oder eine kürzere Dauer.";
    Array.prototype.forEach.call($("slotBox").querySelectorAll(".slot"),function(b){
      b.onclick=function(){ $("f_zeit").value=b.dataset.t; drawZeiten(); };
    });

    var box=$("konfliktBox"), out="";
    var spT=gesperrt(sel.datum,sel.closer);
    if(spT) out+='<div class="stop"><b>Tag ist gesperrt</b>'+esc(sel.closer)+' ist an dem Tag nicht da'+(spT.grund?': '+esc(spT.grund):'')+'.</div>';
    if(sel.zeit){
      var von=zeitInMin(sel.zeit), k2=konflikt(sel.datum,sel.closer,von,sel.dauer);
      var endeTxt=zeitText(von+sel.dauer);
      var _a2=adrJetzt();
      var fp=fahrtPruefung(sel.datum,sel.closer,von,sel.dauer,_a2.plz,_a2.ort,a.id);
      if(k2){
        out='<div class="stop"><b>Zeit ist belegt</b>'+esc(sel.closer)+' hat zu der Zeit schon '+esc(name(k2))+
          ' ('+esc(k2.zeit)+' bis '+esc(zeitText(zeitInMin(k2.zeit)+(+k2.dauer||60)))+'). Wähl eine andere Uhrzeit.</div>';
      } else {
        var msSel=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(von/60),von%60).getTime();
        if(msSel<minMs) out='<div class="warnbox">Weniger als '+RULES.leadHours+' Stunden Vorlauf. Geht, aber der Closer muss es schaffen.</div>';
        else if(von<RULES.openHour*60||von+sel.dauer>(RULES.closeHour+1)*60)
          out='<div class="warnbox">Liegt außerhalb der üblichen Zeiten ('+RULES.openHour+':00 bis '+(RULES.closeHour+1)+':00). Geht, kurz mit dem Closer klären.</div>';
        else out='<p class="hint">Termin von '+esc(sel.zeit)+' bis '+esc(endeTxt)+' Uhr.</p>';
      }
      if(fp.meldungen.length){
        out+= fp.eng
          ? '<div class="warnbox" style="margin-top:8px"><b>Fahrzeit wird knapp.</b><br>'+fp.meldungen.map(esc).join("<br>")+'</div>'
          : '<p class="hint" style="margin-top:6px">🚗 '+fp.meldungen.map(esc).join(" ")+'</p>';
      }
      if(fp.unklar.length){
        out+='<div class="warnbox" style="margin-top:8px"><b>Fahrzeit kann ich nicht prüfen.</b><br>'+
          'Unbekannter Ort bei '+esc(fp.unklar.join(" und "))+'. Postleitzahl prüfen, dann rechne ich mit.</div>';
      }
    }
    box.innerHTML=out;
  }

  $("f_pg").onchange=quali;
  $("f_wohn").onchange=quali;
  $("f_datum").onchange=drawZeiten;
  $("f_closer").onchange=drawZeiten;
  $("f_zeit").oninput=drawZeiten;

  var gewaehlt=(a.hinweise||[]).slice();

    b.onclick=function(){
      var h=b.dataset.h, i=gewaehlt.indexOf(h);
      if(i>-1) gewaehlt.splice(i,1); else gewaehlt.push(h);

      return x.id!==a.id && String(x.telefon||"").replace(/[^0-9]/g,"")===t;
    })[0];
    if(treffer){
      h.textContent="Achtung: diese Nummer steht schon bei "+name(treffer)+", "+deDate(parseYmd(treffer.datum))+" "+treffer.zeit+".";

    } else { h.textContent=""; h.style.color=""; }
  }
  $("f_tel").oninput=telCheck;

  quali(); plzCheck(); telCheck(); drawZeiten(); zeigeSchritt(1);

  // Enter springt weiter, im letzten Feld wird gespeichert
  (function(){
    var reihe=["f_vor","f_nach","f_tel","f_adr","f_datum","f_zeit","f_dauer","f_pg","f_wohn","f_notiz"];
    reihe.forEach(function(id,i){
      var el=$(id); if(!el) return;
      el.addEventListener("keydown",function(e){
        if(e.key!=="Enter"||e.shiftKey) return;
        if(id==="f_notiz") return;
        e.preventDefault();
        for(var j=i+1;j<reihe.length;j++){
          var n=$(reihe[j]);
          if(n&&!n.disabled){ n.focus(); if(n.select) try{ n.select(); }catch(x){} return; }
        }
        (schritt===1?$("weiterBtn"):$("saveBtn")).click();

    var err=$("formErr");

    return false;
  }
  function schritt1Ok(){
    var err=$("formErr"); err.hidden=true;
    var vor=$("f_vor").value.trim(), nach=$("f_nach").value.trim();
    if(!vor&&!nach) return fehler("Vorname und Nachname fehlen.","f_vor");
    if(!$("f_tel").value.trim()) return fehler("Ohne Telefonnummer kann der Closer nicht zurückrufen.","f_tel");

    var sp=gesperrt(sel.datum,sel.closer);
    if(sp) return fehler(sel.closer+" ist an dem Tag nicht da"+(sp.grund?" ("+sp.grund+")":"")+". Wähl einen anderen Tag.","f_datum");
    drawZeiten();
    if(!sel.zeit) return fehler("Trag eine Uhrzeit ein oder wähl einen Vorschlag.","f_zeit");
    if(konflikt(sel.datum,sel.closer,zeitInMin(sel.zeit),sel.dauer))
      return fehler("Zu der Zeit ist schon ein Termin. Wähl eine andere Uhrzeit.","f_zeit");
    return true;
  }

  $("zurueckBtn").onclick=function(){ $("formErr").hidden=true; zeigeSchritt(1); };

  $("saveBtn").onclick=function(){
    var err=$("formErr");
    function fail(msg,focus){ err.hidden=false; err.textContent=msg; if(focus) $(focus).focus(); }
    if(!schritt1Ok()){ zeigeSchritt(1); return; }
    var vor=$("f_vor").value.trim(), nach=$("f_nach").value.trim(), adr=adrJetzt();
    if(!$("f_pg").value) return fail("Pflegegrad fehlt. Frag danach, ohne ihn geht es nicht weiter.","f_pg");
    if(!quali()) return fail("Dieser Lead qualifiziert sich nicht für einen Termin, siehe Hinweis oben.","f_pg");
    drawZeiten();
    if(konflikt(sel.datum,sel.closer,zeitInMin(sel.zeit),sel.dauer))
      return fail("Die Zeit ist bei "+sel.closer+" schon belegt.","f_zeit");
    err.hidden=true;

    var wasMove=!!edit, oldWhen=edit?(deDate(parseYmd(edit.datum))+" "+edit.zeit):"";
    var obj={
      id:edit?edit.id:uid(),
      vorname:vor, nachname:nach,
      telefon:$("f_tel").value.trim(),
      strasse:adr.strasse, plz:adr.plz, ort:adr.ort,
      pflegegrad:$("f_pg").value, wohnform:$("f_wohn").value,
      notiz:$("f_notiz").value.trim(), hinweise:gewaehlt,
      entscheider:$("f_ent").checked, papiere:$("f_pap").checked,
      datum:sel.datum, zeit:sel.zeit, dauer:sel.dauer,
      closer:sel.closer, setter:edit?edit.setter:S.me.name,
      status:edit?(edit.status==="abgesagt"?"geplant":edit.status):"geplant",
      leistungen:edit?(edit.leistungen||[]):[],
      createdAt:edit?edit.createdAt:Date.now(),
      updatedAt:Date.now(), updatedBy:S.me.name
    };
    upsertAppt(obj).then(function(){
      var wer=(vor+" "+nach).trim();
      if(wasMove) logEvent("verschoben",wer+" verschoben auf "+deDate(parseYmd(obj.datum))+" "+obj.zeit,obj.id,"verschoben");
      else logEvent("neu","Neuer Termin: "+wer+" ("+pgText(obj)+") am "+deDate(parseYmd(obj.datum))+" um "+obj.zeit+" bei "+obj.closer,obj.id);
      closeOverlay();
      S.weekStart=mondayOf(parseYmd(obj.datum));
      render();
      toast(wasMove?"Termin verschoben, alle sind informiert.":"Termin eingetragen, alle sind informiert.");
    }).catch(function(){ fail("Speichern hat nicht geklappt. Probier es noch einmal."); });
  };
  setTimeout(function(){ var f=$("f_vor"); if(f&&!edit) f.focus(); },60);
}

function thema(){
  var t=null;
  try{ t=localStorage.getItem("sb_thema"); }catch(e){}
  return (t==="dunkel")?"dunkel":"hell";
}
function themaSetzen(t){
  try{ localStorage.setItem("sb_thema",t); }catch(e){}
  themaAnwenden();
}
function themaAnwenden(){
  var t=thema();
  if(t==="dunkel") document.documentElement.setAttribute("data-theme","dunkel");
  else document.documentElement.removeAttribute("data-theme");
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", t==="dunkel" ? "#0C1420" : "#1657B0");
}
function zeichneThema(){
  var box=$("themaBar"); if(!box) return;
  Array.prototype.forEach.call(box.querySelectorAll("button"),function(b){
    b.setAttribute("aria-pressed",String(b.dataset.t===thema()));
    b.onclick=function(){ themaSetzen(b.dataset.t); zeichneThema(); };
  });
}

function zeichnePush(){
  var box=$("pushBox"); if(!box) return;
  var st=PUSH.status();
  if(st==="geht nicht"){
    box.innerHTML='<p class="hint">Dieser Browser kann keine Mitteilungen. Nimm Safari auf dem iPhone oder Chrome auf Android.</p>';
    return;
  }
  if(st==="homescreen"){
    box.innerHTML='<div class="warnbox"><b>Erst zum Home-Bildschirm hinzufügen</b><br>'+
      'Auf dem iPhone gehen Mitteilungen nur, wenn die Seite als App gespeichert ist. '+
      'Unten auf das Teilen-Symbol tippen, dann <b>Zum Home-Bildschirm</b>. Danach die App von dort öffnen und hier wieder hereinschauen.</div>';
    return;
  }
  if(st==="denied"){
    box.innerHTML='<p class="hint">Mitteilungen sind für diese Seite gesperrt. Das lässt sich nur in den Einstellungen des Handys wieder erlauben.</p>';
    return;
  }
  var an=(st==="granted");
  box.innerHTML='<p class="hint" style="margin-bottom:8px">'+
      (an?'Dieses Gerät bekommt Mitteilungen bei neuen Terminen, Änderungen und eine Erinnerung vor dem Termin.'
        : 'Neuer Termin, Absage, Erinnerung vor dem Termin und morgens die Übersicht des Tages.')+'</p>'+
    '<button class="btn '+(an?"":"primary")+'" id="pushBtn">'+(an?"Dieses Gerät abmelden":"Mitteilungen einschalten")+'</button>'+
    '<p class="err" id="pushErr" hidden style="margin-top:8px"></p>';
  $("pushBtn").onclick=function(){
    var b=$("pushBtn"), e=$("pushErr");
    e.hidden=true; b.disabled=true;
    var p = an ? PUSH.abmelden() : PUSH.anmelden();
    p.then(function(){
      b.disabled=false;
      toast(an?"Dieses Gerät bekommt keine Mitteilungen mehr.":"Mitteilungen sind an.");
      zeichnePush(); zeichneThema(); renderBanner();
    }).catch(function(err){
      b.disabled=false; e.hidden=false;
      e.textContent=(err&&err.message)||"Hat nicht geklappt.";
    });
  };
}
