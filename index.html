<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1657B0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Setterboard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<title>Setterboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F1F6FC;
  --line:#D5E2F1;
  --line-soft:#E8EFF8;
  --ink:#0E1B2A;
  --ink-2:#42566C;
  --ink-3:#7789A0;
  --accent:#0B5FA5;
  --accent-soft:#E1EDF9;
  --accent-ink:#084B83;
  --money:#0F7355;
  --money-soft:#DFF1EA;
  --ok:#0F7355;
  --ok-soft:#DFF1EA;
  --bad:#B3261E;
  --bad-soft:#FAE8E6;
  --warn:#9C5A00;
  --warn-soft:#FAEFDF;
  --shadow:0 1px 2px rgba(14,27,42,.05),0 10px 26px -14px rgba(11,95,165,.28);
  --radius:10px;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}

/* Dunkler Kalender. Wird über den Schalter unter Zugänge eingestellt. */
:root[data-theme="dunkel"]{
  --paper:#1B1B19;
  --surface:#222220;
  --surface-2:#2A2A27;
  --line:#3A3A36;
  --line-soft:#31312E;
  --ink:#F2F1EC;
  --ink-2:#C6C4BC;
  --ink-3:#928F86;
  --accent:#4A8FD4;
  --accent-soft:#25303C;
  --accent-ink:#8FBEEB;
  --money:#5FB894;
  --money-soft:#22302B;
  --ok:#5FB894;
  --ok-soft:#22302B;
  --bad:#E08A80;
  --bad-soft:#382625;
  --warn:#D3A263;
  --warn-soft:#332B20;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 26px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1440px;margin:0 auto;padding-block:10px;padding-inline:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:4px}
.brand b{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.03em;color:var(--accent)}
.brand span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em}
.kopfkal{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--line)}
.kopfkal small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);line-height:1.1;font-weight:600}
.kopfkal b{display:block;font-family:var(--font-display);font-size:17px;letter-spacing:-.02em;line-height:1.2}
@media (max-width:640px){ .kopfkal{padding-left:8px} .kopfkal b{font-size:15px} }
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:8px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.spacer{flex:1 1 auto}
.suche{position:relative;flex:0 1 260px;max-width:300px;min-width:150px;margin-left:10px}
.suche .lupe{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6;pointer-events:none}
.suche input{
  width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;
  padding:9px 14px 9px 32px;font-size:14px;
}
.suche input:focus{background:var(--surface);border-color:var(--accent)}
.suchliste{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:40;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);max-height:min(420px,70vh);overflow-y:auto;padding:5px;
}
.streffer{
  display:block;width:100%;text-align:left;border:0;background:transparent;cursor:pointer;
  padding:9px 10px;border-radius:8px;
}
.streffer:hover,.streffer:focus-visible{background:var(--surface-2)}
.streffer b{display:block;font-size:14.5px}
.streffer span{display:block;font-size:12.5px;color:var(--ink-3)}
.suchleer{padding:12px 10px;font-size:13.5px;color:var(--ink-3)}
@media (max-width:640px){
  .suche{order:9;flex:1 0 100%;max-width:none;margin-top:2px}
}
.who{display:flex;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px}
.avatar{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:12px;background:var(--accent-soft);color:var(--accent-ink)}
.who small{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;display:block;line-height:1.1}
.who b{font-size:13px;font-weight:600;display:block;line-height:1.2}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.bell svg{width:18px;height:18px;stroke:var(--ink-2);fill:none;stroke-width:1.7}
.bell .count{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;background:var(--bad);color:#fff;border-radius:999px;font-family:var(--font-mono);font-size:11px;font-weight:600;display:grid;place-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;max-width:1440px;width:100%;margin:0 auto;padding-inline:16px;padding-block:16px 60px}

/* ---------- week ---------- */
.weekbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.weekbar h2{font-size:15px;font-weight:700;letter-spacing:0;color:var(--ink-2);text-transform:uppercase}
.startort{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;white-space:nowrap}
.weekbar .range{font-family:var(--font-mono);font-size:13px;color:var(--ink-3)}
.nav{display:flex;gap:4px}
.nav button{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2);font-size:15px;line-height:1}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filters .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* Umschalter Tag / Woche / Monat */
.modus{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.modus button{border:0;background:transparent;border-radius:8px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-3);cursor:pointer;line-height:1}
.modus button[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 2px rgba(15,35,70,.12)}
.heutebtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.heute-stark{background:var(--accent);border-color:var(--accent);color:#fff;font-size:14.5px;
  padding:10px 18px;border-radius:10px;min-height:44px}
.heute-stark:hover{filter:brightness(1.06)}
.heute-stark.ruht{background:var(--surface);border-color:var(--line);color:var(--ink-3);font-weight:600}

/* Wochenraster auf schmalen Geraeten seitwaerts schiebbar */
html,body{max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
.calscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
/* Abstand zwischen den Feldgruppen im Terminformular */
#schritt1>.two,#schritt2>.two{margin-bottom:12px}
.calinner{min-width:100%}

/* Monatsgitter */
.monkopf{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0}
.monkopf div{padding:9px 6px;text-align:center;font-family:var(--font-display);font-size:11.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-left:1px solid var(--line)}
.monkopf div:first-child{border-left:0}
.monkopf div.we{color:var(--ink-3);opacity:.6}
.mongrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);
  border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.montag{border-left:1px solid var(--line);border-top:1px solid var(--line);min-height:112px;
  padding:7px 7px 8px;text-align:left;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;gap:4px;overflow:hidden;transition:background .12s}
.montag:nth-child(7n+1){border-left:0}
.montag .mzahl{font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:var(--ink-2);
  align-self:flex-start;line-height:22px;min-width:22px;height:22px;text-align:center;border-radius:999px}
.montag.we{background:var(--surface-2)}
.montag.fremd{background:var(--surface-2)}
.montag.fremd .mzahl{color:var(--ink-3);opacity:.5}
.montag.fremd .mzeile{opacity:.5}
.montag.heute .mzahl{background:var(--accent);color:#fff}
.montag.gesperrt{background:repeating-linear-gradient(135deg,transparent 0 9px,var(--line-soft) 9px 18px)}
.montag:hover{background:var(--accent-soft)}
.mzeile{display:flex;gap:5px;align-items:baseline;font-size:11.5px;line-height:1.35;
  background:var(--surface-2);border-left:3px solid var(--st,var(--accent));border-radius:0 5px 5px 0;
  padding:2px 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mzeile b{font-family:var(--font-mono);font-weight:600;color:var(--ink-3);font-size:10.5px;flex:0 0 auto}
.mzeile span{overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink)}
.mzeile.st-stattgefunden{background:var(--ok-soft)}
.mzeile.st-nichtda{background:var(--bad-soft)}
.mzeile.st-folgetermin{background:var(--warn-soft)}
.mmehr{font-size:10.5px;color:var(--ink-3);padding-left:3px}
.mfahrt{margin-top:auto;font-family:var(--font-mono);font-size:10px;color:var(--ink-3);opacity:.85}
.mpunkte{display:flex;gap:3px;flex-wrap:wrap;margin-top:1px}
.mpunkte i{width:7px;height:7px;border-radius:999px;background:var(--st,var(--accent));display:block}
.weekwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.weekmain{min-width:0}
.side{
  position:sticky;top:70px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 14px;max-height:calc(100vh - 100px);overflow-y:auto;cursor:default;
}
.side h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:6px}
.side .ev{padding:9px 0;font-size:13.5px}
.side .ev .txt{font-size:13.5px}
.side .ev .when{font-size:11px}
@media (max-width:1099px){ .weekwrap{grid-template-columns:1fr} .side{display:none} }
/* Zeitraster mit Achse links */
.cal{--h:58px;--axis:52px}
.tagkopf{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;padding:8px 10px}
.tagnav{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:17px;line-height:1;cursor:pointer;color:var(--ink-2)}
.tagtitel{flex:1;text-align:center;line-height:1.2}
.tagtitel b{display:block;font-family:var(--font-display);font-size:16px}
.tagtitel span{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.calhead{
  display:grid;grid-template-columns:var(--axis) repeat(6,minmax(0,1fr));
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;
}
.calhead .hc{padding:7px 9px;border-left:1px solid var(--line);display:flex;align-items:baseline;gap:6px}
.calhead .hc:first-child{border-left:0}
.calhead .dow{font-family:var(--font-display);font-weight:700;font-size:13px}
.calhead .dnum{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.calhead .hc.today{background:var(--accent-soft)}
.calhead .hc.today .dow{color:var(--accent-ink)}
.calbody{
  display:grid;grid-template-columns:var(--axis) repeat(6,minmax(0,1fr));
  background:var(--surface);border:1px solid var(--line);border-top:0;
  border-radius:0 0 var(--radius) var(--radius);overflow:hidden;
}
.calbody.tagbody{grid-template-columns:var(--axis) minmax(0,1fr)}
.axis{position:relative}
.axis .tick{position:absolute;right:7px;font-family:var(--font-mono);white-space:nowrap;line-height:1}
.axis .tick.major{font-size:12px;font-weight:600;color:var(--ink-2)}
.axis .tick.minor{font-size:9.5px;color:var(--ink-3);opacity:.75}
.daycol{
  position:relative;border-left:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom,var(--line-soft) 0 1px,transparent 1px var(--h));
}
.daycol.frei::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent 0 9px,var(--surface-2) 9px 10px);opacity:.5;
}
.slotbtn{position:absolute;left:0;right:0;border:0;background:transparent;cursor:pointer;padding:0}
.slotbtn:hover{background:var(--accent-soft);opacity:.55}
.tblock{
  z-index:2;
  position:absolute;left:3px;right:3px;cursor:pointer;text-align:left;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--st,var(--accent));
  border-radius:6px;padding:4px 6px;
}
.tblock .stapel{display:flex;flex-direction:column;gap:1px;min-width:0;width:100%}
.tblock span{display:block}
.tblock:hover{border-color:var(--accent);border-left-color:var(--st,var(--accent))}
.tblock .z{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--ink-3);display:inline}
.tblock .n{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tblock.gross{padding:7px 9px}
.tblock.gross .stapel{gap:3px}
.tblock.gross .u{white-space:normal;line-height:1.3}
.tblock .n.gross{white-space:normal;font-size:14px;line-height:1.2;margin-bottom:1px}
.tblock .tmarken{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.tblock .tmarken span{background:var(--accent-soft);color:var(--accent-ink);border-radius:4px;padding:1px 5px;font-size:9.5px;font-weight:600;white-space:nowrap}
.tblock .tnotiz{color:var(--ink-3);font-size:10.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tblock .u{font-size:10.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tblock .ort{font-size:12.5px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.tblock.gross .ort{font-size:14px;color:var(--ink)}
.tblock.st-nichtda{background:var(--bad-soft)}
.tblock.st-stattgefunden{background:var(--ok-soft)}
.tblock.st-folgetermin{background:var(--warn-soft)}
.tblock.st-abgesagt{opacity:.55}
.fahrt{
  position:absolute;left:2px;right:2px;border-radius:5px;z-index:1;
  background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px);
  border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;
}
.fahrt span{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-3)}
.calhead .fahrt-tag{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.daycol.gesperrt{background-color:var(--surface-2)}
.sperrband{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent 0 10px,var(--line-soft) 10px 20px);z-index:4}
.sperrband span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;color:var(--ink-2)}
.jetzt{position:absolute;left:0;right:0;height:2px;background:var(--bad);pointer-events:none;z-index:3}
.jetzt::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:999px;background:var(--bad)}
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:start}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-height:118px;display:flex;flex-direction:column}
.day-head{background:var(--surface-2);border-radius:var(--radius) var(--radius) 0 0}
.day.today{border-color:var(--accent);box-shadow:var(--shadow)}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:9px 11px;border-bottom:1px solid var(--line-soft)}
.day-head .dow{font-family:var(--font-display);font-weight:700;font-size:13px}
.day.today .dow{color:var(--accent)}
.day-head .dnum{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.day-body{padding:8px;display:flex;flex-direction:column;gap:7px}
.day-empty{padding:10px 11px 14px;color:var(--ink-3);font-size:12.5px}
.card{width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--st,var(--ink-3));border-radius:8px;padding:8px 9px;display:flex;flex-direction:column;gap:3px}
.card:hover{border-color:var(--accent);border-left-color:var(--st,var(--ink-3))}
.card .t{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--ink-2)}
.card .k{font-weight:600;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.card .m{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.card .kort{font-size:14px;font-weight:600;color:var(--ink-2);line-height:1.2}
.pg{display:inline-block;font-family:var(--font-mono);font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);border-radius:4px;padding:1px 5px;margin-right:5px}
.pill{display:inline-flex;align-items:center;align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-top:2px}
.pill.geplant{background:var(--accent-soft);color:var(--accent-ink)}
.pill.stattgefunden{background:var(--ok-soft);color:var(--ok)}
.pill.nichtda{background:var(--bad-soft);color:var(--bad)}
.pill.folgetermin{background:var(--warn-soft);color:var(--warn)}
.pill.abgesagt{background:var(--surface-2);color:var(--ink-3)}

/* ---------- panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,25,45,.44);z-index:40;border:0;padding:0}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:50;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.griff{
  position:absolute;left:-15px;top:0;bottom:0;width:28px;cursor:col-resize;z-index:3;
  display:flex;align-items:center;justify-content:flex-start;
}
.griff::before{
  content:"";width:15px;height:60px;border-radius:9px 0 0 9px;
  background:var(--surface);border:1px solid var(--line);border-right:0;
  box-shadow:-3px 0 8px rgba(14,27,42,.10);
}
.griff::after{
  content:"";position:absolute;left:5px;width:3px;height:22px;border-radius:2px;background:var(--ink-3);
}
.griff:hover::before,.griff.zieht::before{border-color:var(--accent);background:var(--accent-soft)}
.griff:hover::after,.griff.zieht::after{background:var(--accent);height:30px}
@media (max-width:700px){
  .griff{display:none}
  .panel{
    width:100%;border-left:0;
    overscroll-behavior:contain;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .panel-body{
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
    padding:14px;
  }
  .panel-head{padding:12px 14px}
  .panel-foot{padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
}
/* Solange ein Panel offen ist, steht die Seite dahinter still */
body.panel-offen{overflow:hidden;position:relative;width:100%}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:16px;flex:1}
.panel-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.x{border:0;background:transparent;font-size:20px;line-height:1;color:var(--ink-3);cursor:pointer;padding:4px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.kv dd{margin:0;overflow-wrap:anywhere}
.note{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.sec-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.statusrow{display:flex;gap:6px;flex-wrap:wrap}
.statusrow{gap:8px}
.statusrow button{flex:1 1 30%;min-width:112px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:15px 10px;font-size:14.5px;font-weight:700;cursor:pointer;line-height:1.2}
.statusrow button[data-s="stattgefunden"][aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.statusrow button[data-s="nichtda"][aria-pressed="true"]{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.statusrow button[data-s="folgetermin"][aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.callrow{display:flex;gap:8px;flex-wrap:wrap}
.callrow a{flex:1 1 auto;min-width:104px;text-align:center;text-decoration:none;font-weight:700;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:14px 10px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px}
.callrow a:hover{border-color:var(--accent);color:var(--accent)}
.callrow a.haupt{background:var(--accent);border-color:var(--accent);color:#fff}
.callrow a.haupt:hover{color:#fff;filter:brightness(1.06)}
/* Werte in der Uebersicht, die man antippen kann */
.tipp{color:var(--accent-ink);text-decoration:none;font-weight:600;border-bottom:1px dashed var(--accent);}
.tipp:hover{border-bottom-style:solid}
.leistungen{display:flex;flex-direction:column;gap:6px}
.leistungen label{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px}
.leistungen label:hover{border-color:var(--accent)}
.leistungen input{width:auto;margin:0}
.leistungen .eur{margin-left:auto;font-family:var(--font-mono);font-size:13px;color:var(--money);font-weight:600}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 11px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{background:var(--surface)}
.field textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink-3);cursor:pointer;line-height:1.4;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.check:hover{border-color:var(--accent)}
.check b{color:var(--ink);font-size:14px;font-weight:600}
.check input:checked ~ span b{color:var(--accent)}
.check input{width:auto;margin-top:2px;flex:0 0 auto}
.slots{display:flex;flex-wrap:wrap;gap:6px}
/* Terminvorschlaege nach Fahrtzeit */
.neuerungen{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:14px}
.neuerungen .n-kopf{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.neuerungen .n-kopf b{font-size:14px;color:var(--accent-ink)}
.neuerungen .n-kopf span{font-size:11px;color:var(--ink-3);margin-left:auto}
.neuerungen ul{margin:0 0 6px 18px;padding:0}
.neuerungen li{font-size:13.5px;line-height:1.45;margin-bottom:2px}
.fassungsleiste{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));
  z-index:60;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--accent);
  border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.fassungsleiste span{font-size:13.5px;font-weight:600;color:var(--ink)}
.fassungsleiste .btn{padding:7px 12px;font-size:13px}
.vors{display:flex;flex-direction:column;gap:6px}
.vorschlag{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:2px;width:100%;
  min-height:48px;text-align:left;align-items:center;
  border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;cursor:pointer}
.vorschlag:hover{border-color:var(--accent)}
.vorschlag[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.vorschlag .vtag{grid-column:1;grid-row:1;font-family:var(--font-mono);font-size:13.5px;font-weight:600;white-space:nowrap}
.vorschlag .vzus{grid-column:2;grid-row:1/3;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;text-align:right}
.vorschlag .vwarum{grid-column:1;grid-row:2;font-size:11.5px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vorschlag.top{border-color:var(--ok)}
.vorschlag.top .vzus{color:var(--ok)}
.vorschlag.top{background:var(--ok-soft)}
.kopfmarke{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.kopfmarke-name{font-family:var(--font-display);font-weight:800;font-size:23px;letter-spacing:-.01em;color:var(--accent)}
.kopfmarke-satz{font-size:13px;color:var(--ink-3);margin-top:2px}
.kalreihe{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.kalkachel{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--radius);padding:10px 14px 10px 10px;cursor:pointer;text-align:left;min-width:190px}
.kalkachel:hover{border-color:var(--accent)}
.kalkachel.eigen{border-color:var(--accent);background:var(--accent-soft)}
.kk-text b{display:block;font-size:14.5px;font-weight:700;line-height:1.2}
.kk-text small{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.naechstzeile{font-size:13.5px;color:var(--ink-2);margin-bottom:14px}
.naechstzeile b{color:var(--ink-3);text-transform:uppercase;font-size:11px;letter-spacing:.07em;margin-right:6px}
.kalsuche{margin-bottom:10px}
.kalsuche input{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:9px 14px;width:100%;max-width:280px}
.who .burger{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:0 0 auto;opacity:.65}
.who:hover .burger{opacity:1}
@media (max-width:640px){ .who .who-text{display:none} }
.merk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.merk input{width:auto;margin:0}
.schrittleiste{display:flex;gap:8px;margin-bottom:4px}
.schrittleiste .sk{flex:1;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);border-top:3px solid var(--line);padding-top:7px}
.schrittleiste .sk[aria-current="true"]{color:var(--accent-ink);border-top-color:var(--accent)}
.hinweise{display:flex;flex-wrap:wrap;gap:6px}
.marke{background:var(--accent-soft);color:var(--accent-ink);border-radius:6px;padding:4px 9px;font-size:12.5px;font-weight:600}
.hinweise .chip{font-size:12.5px;padding:5px 10px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;font-family:var(--font-mono);font-size:13px;font-weight:500;cursor:pointer}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.slot:disabled{opacity:.36;cursor:not-allowed;text-decoration:line-through}
.slot.eng{border-color:var(--warn);color:var(--warn)}
.slot.eng::after{content:" 🚗";font-size:10px}
.hint{font-size:12.5px;color:var(--ink-3)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.stop{border:1px solid var(--bad);background:var(--bad-soft);border-radius:9px;padding:11px 13px;font-size:13.5px;color:var(--ink)}
.stop b{display:block;margin-bottom:3px;color:var(--bad)}
.warnbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:9px;padding:10px 12px;font-size:13px;color:var(--ink)}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:2px 0}

/* ---------- activity ---------- */
.feed{display:flex;flex-direction:column}
.ev{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.ev:last-child{border-bottom:0}
.ev .dot{width:8px;height:8px;border-radius:999px;margin-top:7px;flex:0 0 auto;background:var(--ink-3)}
.ev.neu .dot{background:var(--accent)}
.ev.verschoben .dot{background:var(--warn)}
.ev.abgesagt .dot{background:var(--bad)}
.ev.status .dot{background:var(--ok)}
.ev .txt{flex:1;font-size:14px;overflow-wrap:anywhere}
.ev .when{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap;padding-top:2px}
.ev.klickbar{width:100%;text-align:left;background:transparent;border:0;font:inherit;color:inherit;cursor:pointer}
.ev.klickbar:hover{background:var(--surface-2);margin-inline:-8px;padding-inline:8px;border-radius:6px}
.ev.unseen{background:linear-gradient(90deg,var(--accent-soft),transparent 70%);margin-inline:-8px;padding-inline:8px;border-radius:6px}

/* ---------- start ---------- */
.hallo{margin-bottom:18px}
.hallo h2{font-size:24px;font-weight:800}
.hallo p{color:var(--ink-2);font-size:14.5px;margin:5px 0 0}
.homegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:22px}
.kal-karte{
  text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:16px 17px;cursor:pointer;display:flex;flex-direction:column;gap:10px;
}
.kal-karte:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.kal-karte .kopf{display:flex;align-items:center;gap:10px}
.kal-karte .kopf b{font-family:var(--font-display);font-size:17px;letter-spacing:-.02em}
.kal-karte .ich{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-left:auto}
.kal-karte .startzeile{font-size:12.5px;color:var(--ink-3);margin-top:-4px}
.kal-karte .zahlen{display:flex;gap:16px}
.kal-karte .zahl{display:flex;flex-direction:column}
.kal-karte .zahl b{font-family:var(--font-display);font-size:21px;font-variant-numeric:tabular-nums;line-height:1.1}
.kal-karte .zahl span{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.kal-karte .naechster{font-size:13px;color:var(--ink-2);border-top:1px solid var(--line-soft);padding-top:9px}
.wege{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.weg{
  text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:13px 15px;cursor:pointer;font-size:14.5px;font-weight:600;
}
.weg:hover{border-color:var(--accent);color:var(--accent)}
.weg small{display:block;font-weight:400;font-size:12.5px;color:var(--ink-3);margin-top:2px}

/* ---------- Tagesliste ---------- */
.tagesliste{display:flex;flex-direction:column;gap:10px;max-width:640px}
.tagkarte{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--st,var(--accent));border-radius:11px;padding:13px 15px}
.tagkarte .kopfzeile{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.tagkarte .zeit{font-size:13px;font-weight:600;color:var(--ink-2)}
.tagkarte .pill{margin-top:0}
.tagkarte .tagname{border:0;background:transparent;padding:0;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--ink);cursor:pointer;text-align:left}
.tagkarte .tagname:hover{color:var(--accent)}
.tagkarte .tagzeile{font-size:13.5px;color:var(--ink-3);margin-top:2px}

/* ---------- numbers ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px}
.tile .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.tile .val{font-family:var(--font-display);font-weight:800;font-size:29px;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.tile.money .val{color:var(--money)}
.tile.limit{border-color:var(--warn)}
.tile.limit .val{color:var(--warn)}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;padding:0 10px 7px;border-bottom:1px solid var(--line)}
table.data td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.data td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.ok i{background:var(--ok)}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;overflow-x:auto;margin-bottom:16px}
.tablewrap h3{font-size:15px;margin-bottom:4px}
.tablewrap .sub{font-size:12.5px;color:var(--ink-3);margin-bottom:12px}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;z-index:60;background:var(--paper);display:grid;place-items:center;padding:24px 16px;overflow-y:auto}
.gate-box{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.gate-box h1{font-size:22px;font-weight:800}
.gate-box p{color:var(--ink-2);font-size:14px;margin:6px 0 18px}
.people{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.person{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;cursor:pointer;text-align:left;width:100%}
.person:hover{border-color:var(--accent)}
.person .r{margin-left:auto;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.person-row{display:flex;gap:6px;align-items:stretch}
.person-row .person{flex:1;min-width:0}
.person-row .person b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{flex:0 0 auto;width:38px;border:1px solid var(--line);background:var(--surface);border-radius:9px;color:var(--ink-3);font-size:15px;line-height:1;cursor:pointer}
.del:hover{border-color:var(--bad);color:var(--bad)}
.del.pwbtn:hover{border-color:var(--accent);color:var(--accent)}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:9px;padding:10px 11px;display:flex;flex-direction:column;gap:9px}
.confirm p{margin:0;font-size:13.5px;color:var(--ink)}
.confirm .row{display:flex;gap:7px}
.confirm button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.confirm button.yes{background:var(--bad);border-color:var(--bad);color:#fff}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:70;background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:9px;font-size:14px;box-shadow:var(--shadow);max-width:min(520px,92vw)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--radius);padding:11px 13px;font-size:13.5px;color:var(--ink-2);margin-bottom:14px}
.banner b{color:var(--ink)}
.untenleiste{
  position:fixed;left:0;right:0;bottom:0;z-index:28;display:grid;
  grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;gap:2px;
  background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-right));
  box-shadow:0 -2px 12px rgba(14,27,42,.06);
}
.ul-knopf{
  border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:9px;font-size:11px;font-weight:600;color:var(--ink-3);
}
.ul-knopf .ul-icon{font-size:17px;line-height:1}
.ul-knopf[aria-selected="true"]{color:var(--accent)}
.ul-plus{
  border:0;background:var(--accent);color:#fff;border-radius:11px;
  font-size:14px;font-weight:700;line-height:1;cursor:pointer;
  padding:11px 16px;margin:0 6px;white-space:nowrap;
}
.ul-plus:hover{filter:brightness(1.1)}
main{padding-bottom:86px}

@media (prefers-reduced-motion:no-preference){
  .panel{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
}
@media (max-width:899px){
  .week{display:none!important}
  .weekbar .range{display:none}
  .weekbar{margin-bottom:10px;gap:8px}
  .weekbar h2{order:2}
  .weekbar .nav{order:1}
  .weekbar .heutebtn{order:3;margin-left:auto}
  .weekbar .modus{order:0;width:100%}
  .weekbar .modus button{flex:1;padding:9px 0}
  .weekbar .filters{order:4;width:100%}
  .cal{--axis:44px}
  .calbody.tagbody{grid-template-columns:var(--axis) minmax(0,1fr)}
  .cal.wochenmodus .calinner{min-width:640px}
  .cal.wochenmodus .calhead .fahrt-tag{display:none}
  .cal.wochenmodus .calhead .hc{padding:7px 6px;gap:4px}
  .cal.wochenmodus .calbody{overflow:visible}
  .cal.wochenmodus .axis,
  .cal.wochenmodus .calhead .hc:first-child{position:sticky;left:0;z-index:6;background:var(--surface)}
  .cal.wochenmodus .calhead .hc:first-child{background:var(--surface-2)}
  .cal.wochenmodus .axis{box-shadow:1px 0 0 var(--line)}
  .montag{min-height:62px;padding:3px 2px 4px}
  .montag .mzahl{font-size:11.5px;min-width:19px}
  .monkopf div{font-size:10px;padding:5px 2px}
}
@media (min-width:900px){ .week{display:none!important} }
.tagkopf{display:none}

/* ---------------- Zugangsdaten ---------------- */
function hashPw(pw){
  var text=String(pw||"")+"::setterboard";
  if(window.crypto&&window.crypto.subtle&&window.crypto.subtle.digest){
    return window.crypto.subtle.digest("SHA-256",new TextEncoder().encode(text)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b),function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
    }).catch(function(){ return einfachHash(text); });
  }
  return Promise.resolve(einfachHash(text));
}
function einfachHash(t){
  var h=5381;
  for(var i=0;i<t.length;i++){ h=((h<<5)+h+t.charCodeAt(i))|0; }
  return "e"+(h>>>0).toString(16);
}
function benutzerNorm(v){
  var t=String(v||"").trim().toLowerCase();
  t=t.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
  t=t.replace(/[\s]+/g,".");          // Leerzeichen werden zum Punkt
  t=t.replace(/[^a-z0-9._-]/g,"");     // alles andere faellt weg
  t=t.replace(/^[._-]+|[._-]+$/g,"");
  return t;
}

}

function sbStore(){
  var cb={team:null,appts:null,act:null,sperr:null}, timer=null, laeuft=false;

  function melde(e){
    var t=(e&&(e.message||e.error_description||e.code))||"Fehler";
    setDiag("Datenbank meldet: "+String(t).slice(0,160),true);
  }

  function runde(){
    if(laeuft) return Promise.resolve();
    laeuft=true;
    return sb.from("kalender").select("*").then(function(r){
      if(r.error) throw r.error;
      KAL={}; KAL_ID={};
      (r.data||[]).forEach(function(k){ KAL[k.id]=k; KAL_ID[k.name]=k.id; });
      return sb.from("personen").select("*");
    }).then(function(r){
      if(r.error) throw r.error;
      if(cb.team) cb.team((r.data||[]).map(personAusDb));
      return sb.from("termine").select("*");
    }).then(function(r){
      if(r.error) throw r.error;
      if(cb.appts) cb.appts((r.data||[]).map(terminAusDb));
      return sb.from("sperrtage").select("*");
    }).then(function(r){
      if(r.error) throw r.error;
      if(cb.sperr) cb.sperr((r.data||[]).map(function(x){
        return { id:x.id, datum:x.datum, closer:kalNameVon(x.kalender_id)||"", grund:x.grund||"", von:x.von_name||"" };
      }));
      return sb.from("ereignisse").select("*").order("zeitpunkt",{ascending:false}).limit(60);
    }).then(function(r){
      if(r.error) throw r.error;
      if(cb.act) cb.act((r.data||[]).map(function(e){
        return { id:e.id, ts:new Date(e.zeitpunkt).getTime(), by:e.von_name||"", kind:e.art||"status",
                 text:e.text||"", apptId:e.termin_id||"", kalender:kalNameVon(e.kalender_id)||"" };
      }));
      laeuft=false;
      setDiag(S.me ? ("Verbunden. "+S.team.length+" Zugänge, "+S.appts.length+" Termine.") : "Verbindung zum Server steht.");
    }).catch(function(e){ laeuft=false; melde(e); });
  }
  function starten(){ if(timer) return; runde(); timer=setInterval(runde,6000); }
  function jetzt(){ setTimeout(runde,300); }

  return {
    kind:"supabase",
    onTeam:function(f){ cb.team=f; starten(); },
    onAppts:function(f){ cb.appts=f; starten(); },
    onActivity:function(f){ cb.act=f; starten(); },

      return sb.from("termine").delete().eq("id",id).then(function(r){ if(r.error) throw r.error; jetzt(); });
    },
    anfragenLaden:function(){
      return sb.from("anfragen").select("*").eq("status","offen").then(function(r){
        if(r.error) return [];
        return r.data||[];
      });
    },
    anfrageEntscheiden:function(id,status){
      return sb.from("anfragen").update({status:status}).eq("id",id).then(function(r){
        if(r.error) throw r.error; jetzt();
      });
    },
    einladungAnlegen:function(kalId){
      var code=""; var zeichen="abcdefghijkmnpqrstuvwxyz23456789";
      for(var i=0;i<10;i++) code+=zeichen.charAt(Math.floor(Math.random()*zeichen.length));
      return sb.from("einladungen").insert({ code:code, kalender_id:kalId, von_person:S.me.id })
        .then(function(r){ if(r.error) throw r.error; return code; });
    },
    saveMember:function(m){
      var daten={ name:m.name, rolle:m.rolle, kalender_id:m.kalender_id||null };
      return sb.from("personen").update(daten).eq("id",m.id).then(function(r){ if(r.error) throw r.error; jetzt(); });
    },
    delMember:function(id){
      return sb.from("personen").delete().eq("id",id).then(function(r){ if(r.error) throw r.error; jetzt(); });
    },
    addEvent:function(e){
      var kid=kalIdVon(e.kalender||meinCloser());
      return sb.from("ereignisse").insert({
        kalender_id:kid, termin_id:(e.apptId&&String(e.apptId).length>30)?e.apptId:null,

    delEvent:function(id){

    saveSperr:function(x){

    kalenderAnlegen:function(name,st){

/* ---------------- writes: erst der eigene Stand, dann die Datenbank ---------------- */
function mitglied(m){
  var o={name:m.name,rolle:m.rolle};
  if(m.benutzer) o.benutzer=m.benutzer;
  if(m.pwHash) o.pwHash=m.pwHash;
  if(m.gehoertZu) o.gehoertZu=m.gehoertZu;
  if(m.startPlz) o.startPlz=m.startPlz;
  if(m.startOrt) o.startOrt=m.startOrt;
  if(m.startStrasse) o.startStrasse=m.startStrasse;
  return o;
}
function sortTeam(l){ return l.sort(function(a,b){ return (a.rolle+a.name).localeCompare(b.rolle+b.name); }); }
function upsertMember(m){
  S.team=sortTeam(S.team.filter(function(x){ return x.id!==m.id; }).concat([m]));
  renderFilter(); render();
  return store.saveMember(m).catch(function(e){ setDiag("Speichern fehlgeschlagen: "+((e&&e.code)||"unbekannt"),true); throw e; });
}
function removeMember(id){
  S.team=S.team.filter(function(x){ return x.id!==id; });
  renderFilter(); render();
  return store.delMember(id);
}
function removeAppt(id){
  var evs=S.activity.filter(function(e){ return e.apptId===id; });
  S.appts=S.appts.filter(function(x){ return x.id!==id; });
  S.activity=S.activity.filter(function(e){ return e.apptId!==id; });
  render(); renderSide(); renderBell();
  return store.delAppt(id).then(function(){
    return Promise.all(evs.map(function(e){ return store.delEvent(e.id).catch(function(){}); }));
  });
}

function upsertAppt(a){
  var copy={}; for(var k in a){ copy[k]=a[k]; }
  S.appts=S.appts.filter(function(x){ return x.id!==a.id; }).concat([copy])
    .sort(function(x,y){ return startMs(x)-startMs(y); });
  render();
  return store.saveAppt(a).catch(function(e){ setDiag("Termin speichern fehlgeschlagen: "+((e&&e.code)||"unbekannt"),true); throw e; });
}

/* ---------------- helpers ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pad(n){ return n<10?"0"+n:""+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseYmd(s){ var p=String(s).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function mondayOf(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function deDate(d){ return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear(); }
function isoWeek(d){
  var t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  var first=new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-first)/86400000-3+((first.getDay()+6)%7))/7);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function initials(n){ return String(n||"?").trim().slice(0,2).toUpperCase(); }
function eur(n){ return (Math.round(n||0)).toLocaleString("de-DE")+" €"; }
function pct(a,b){ return b>0?Math.round(a/b*100):0; }
function startMs(a){ var p=String(a.datum).split("-"),t=String(a.zeit||"00:00").split(":"); return new Date(+p[0],+p[1]-1,+p[2],+t[0],+t[1]).getTime(); }
function relTime(ts){
  var s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return "gerade eben";
  if(s<3600) return Math.floor(s/60)+" Min";
  if(s<86400) return Math.floor(s/3600)+" Std";
  var d=new Date(ts); return pad(d.getDate())+"."+pad(d.getMonth()+1)+". "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function toast(msg){
  var el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); },4200);
}
function closers(){ return S.team.filter(function(m){ return m.rolle==="closer"; }); }
function name(a){ return ((a.vorname||"")+" "+(a.nachname||"")).trim()||a.kunde||"Ohne Namen"; }
function adresse(a){ return [a.strasse,[a.plz,a.ort].filter(Boolean).join(" ")].filter(Boolean).join(", "); }
function logEvent(kind,text,apptId,schluessel){

  // Gleicher Termin, gleiche Art: den bestehenden Eintrag aktualisieren statt einen neuen anzuhaengen
  var id=(apptId&&schluessel)?("e-"+apptId+"-"+schluessel):uid();
  store.addEvent({id:id,ts:Date.now(),by:S.me?S.me.name:"System",kind:kind,text:text,
    apptId:apptId||"",kalender:meinCloser()||""}).catch(function(){});
}

/* ---------------- Push aufs Handy ---------------- */
var PUSH = {
  sw:null,
  moeglich:("serviceWorker" in navigator && "PushManager" in window && "Notification" in window),
  status:function(){
    if(!this.moeglich) return "geht nicht";
    if(!istHomescreen() && istApple()) return "homescreen";
    return Notification.permission;      // default, granted, denied
  },
  start:function(){
    if(!this.moeglich) return Promise.resolve(null);
    var self=this;
    return navigator.serviceWorker.register("sw.js").then(function(reg){
      self.sw=reg;
      navigator.serviceWorker.addEventListener("message",function(e){
        if(e.data&&e.data.art==="termin-oeffnen"&&e.data.id) setTimeout(function(){ openAppt(e.data.id); },300);
      });
      return reg;
    }).catch(function(){ return null; });
  },
  anmelden:function(){
    var self=this;
    if(!this.moeglich) return Promise.reject(new Error("Dieses Gerät kann keine Mitteilungen."));
    return Notification.requestPermission().then(function(p){
      if(p!=="granted") throw new Error("Du hast Mitteilungen abgelehnt. Das änderst du in den Einstellungen des Handys.");
      return self.sw || self.start();
    }).then(function(reg){
      if(!reg) throw new Error("Der Hintergrunddienst startet nicht.");
      return reg.pushManager.getSubscription().then(function(vorhanden){
        if(vorhanden) return vorhanden;
        if(!PUSH_KEY) throw new Error("Es ist noch kein Schlüssel hinterlegt. Siehe Anleitung push-einrichten.md.");
        return reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ZuBytes(PUSH_KEY) });
      });
    }).then(function(ab){
      var j=ab.toJSON();
      return sb.from("push_geraete").upsert({
        person_id:S.me.id,
        kalender_id:S.me.kalender_id||null,
        endpunkt:j.endpoint,
        p256dh:j.keys&&j.keys.p256dh,
        auth:j.keys&&j.keys.auth,
        geraet:navigator.userAgent.slice(0,180)
      },{ onConflict:"endpunkt" }).then(function(r){
        if(r.error) throw r.error;
        return true;
      });
    });
  },
  abmelden:function(){
    if(!this.sw) return Promise.resolve();
    return this.sw.pushManager.getSubscription().then(function(ab){
      if(!ab) return;
      var e=ab.endpoint;
      return ab.unsubscribe().then(function(){
        return sb.from("push_geraete").delete().eq("endpunkt",e);
      });
    });
  }
};
function istApple(){ return /iPad|iPhone|iPod/.test(navigator.userAgent||""); }
function istHomescreen(){
  return (window.navigator.standalone===true) ||
         (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches);
}
function b64ZuBytes(b64){
  var rein=(b64+"=".repeat((4-b64.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/");
  var roh=window.atob(rein), out=new Uint8Array(roh.length);
  for(var i=0;i<roh.length;i++) out[i]=roh.charCodeAt(i);
  return out;
}

/* ---------------- Auf neue Fassung prüfen ----------------
   Auf dem Server liegt version.json mit Stand und Liste der Neuerungen.
   Steht dort etwas Neueres, bekommt der Nutzer eine Leiste und entscheidet selbst,
   wann er neu lädt. Automatisch neu laden würde Eingaben im Formular zerstören. */
var NEUE_FASSUNG = null;
var NEUERUNGEN = null;      // { stand, punkte:[] } der Fassung, die gerade läuft

function versionPruefen(){
  fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){
    return r.ok ? r.json() : null;
  }).then(function(d){
    if(!d||!d.stand) return;
    // Die Liste gehört zur Fassung auf dem Server. Läuft sie schon hier, ist sie unsere.
    if(d.stand===VERSION){ NEUERUNGEN=d; renderBell(); return; }
    if(d.stand!==NEUE_FASSUNG){ NEUE_FASSUNG=d.stand; zeigeFassungsleiste(); }
  }).catch(function(){});
}

/* Wurde die Liste dieser Fassung schon gelesen? */
function neuerungenGelesen(){
  try{ return localStorage.getItem("sb_neu_gesehen")===VERSION; }catch(e){ return true; }
}
function neuerungenMerken(){
  try{ localStorage.setItem("sb_neu_gesehen",VERSION); }catch(e){}
}
function zeigeFassungsleiste(){
  if($("fassungsleiste")) return;
  var b=document.createElement("div");
  b.id="fassungsleiste";
  b.className="fassungsleiste";
  b.innerHTML='<span>Eine neue Fassung ist da.</span>'+
    '<button class="btn primary" id="fassungLaden">Jetzt laden</button>'+
    '<button class="btn ghost" id="fassungSpaeter">Später</button>';
  document.body.appendChild(b);
  $("fassungLaden").onclick=function(){ neuLaden(); };
  $("fassungSpaeter").onclick=function(){ b.remove(); };
}
function neuLaden(){
  // Hintergrunddienst und Zwischenspeicher mit erneuern, sonst bleibt die alte Fassung hängen
  var fertig=function(){ location.reload(); };
  try{
    if("caches" in window){
      caches.keys().then(function(k){ return Promise.all(k.map(function(n){ return caches.delete(n); })); })
        .then(function(){
          if(navigator.serviceWorker && navigator.serviceWorker.getRegistration)
            return navigator.serviceWorker.getRegistration().then(function(r){ return r && r.update(); });
        }).then(fertig).catch(fertig);
      return;
    }
  }catch(e){}
  fertig();
}

function setDiag(t,bad){

  var b=$("pushBanner");
  if(b&&bad) b.innerHTML='<span>⚠️</span><div><b>Verbindung.</b> '+esc(t)+'</div>';
}

      koord:k,
      text:(c.startOrt||c.startPlz),
      voll:[c.startStrasse,[c.startPlz,c.startOrt].filter(Boolean).join(" ")].filter(Boolean).join(", ")
    };
  }
  return { koord:BASIS, text:"Hannover Mitte", voll:"Hannover Mitte" };
}
function fahrVonStart(closerName,plzB,ortB){
  var b=koord(plzB,ortB); if(!b) return null;
  var km=kmZwischen(startPunkt(closerName).koord,b)*FAHRT.umweg;
  var v = tempo(km);
  return Math.round(km/v*60)+FAHRT.puffer;
}
function minText(m){
  if(m==null) return "?";
  return m>=60 ? Math.floor(m/60)+" Std "+(m%60?(m%60)+" Min":"") : m+" Min";
}
// Prüft, ob der Closer es rechtzeitig hin und danach weiter schafft
function fahrtPruefung(datum,closer,vonMin,dauer,plzNeu,ortNeu,ausserId){
  var tag=S.appts.filter(function(x){
    return x.datum===datum&&x.closer===closer&&x.status!=="abgesagt"&&x.id!==ausserId;
  }).sort(function(a,b){ return zeitInMin(a.zeit)-zeitInMin(b.zeit); });

  var bis=vonMin+dauer, meldungen=[], eng=false;
  var davor=null, danach=null;
  tag.forEach(function(x){
    var xv=zeitInMin(x.zeit), xb=xv+(+x.dauer||60);
    if(xb<=vonMin && (!davor||xb>zeitInMin(davor.zeit)+(+davor.dauer||60))) davor=x;
    if(xv>=bis && (!danach||xv<zeitInMin(danach.zeit))) danach=x;
  });

  var unklar=[];
  if(!koord(plzNeu,ortNeu)) unklar.push("dieser Adresse (PLZ "+(plzNeu||"fehlt")+")");
  if(davor&&!koord(davor.plz,davor.ort)) unklar.push(name(davor)+" (PLZ "+(davor.plz||"fehlt")+")");
  if(danach&&!koord(danach.plz,danach.ort)) unklar.push(name(danach)+" (PLZ "+(danach.plz||"fehlt")+")");

  if(davor){
    var f=fahrMin(davor.plz,davor.ort,plzNeu,ortNeu);
    if(f!=null){
      var ende=zeitInMin(davor.zeit)+(+davor.dauer||60), ankunft=ende+f;
      if(ankunft>vonMin){
        eng=true;
        meldungen.push("Davor "+name(davor)+" in "+(davor.ort||davor.plz||"?")+" bis "+
          pad(Math.floor(ende/60))+":"+pad(ende%60)+". Fahrt "+minText(f)+
          ", er wäre erst "+pad(Math.floor(ankunft/60))+":"+pad(ankunft%60)+" da.");
      } else {
        meldungen.push("Nach "+name(davor)+" sind es "+minText(f)+" Fahrt, das passt.");
      }
    }
  } else {
    var fb=fahrVonStart(closer,plzNeu,ortNeu);
    if(fb!=null) meldungen.push("Von "+startPunkt(closer).text+" rund "+minText(fb)+" Fahrt.");
  }

  if(danach){
    var f2=fahrMin(plzNeu,ortNeu,danach.plz,danach.ort);
    if(f2!=null){
      var los=bis+f2, beginn=zeitInMin(danach.zeit);
      if(los>beginn){
        eng=true;
        meldungen.push("Danach "+name(danach)+" in "+(danach.ort||danach.plz||"?")+" um "+
          esc(danach.zeit)+". Fahrt "+minText(f2)+", er käme "+(los-beginn)+" Min zu spät.");
      }
    }
  }
  return { eng:eng, meldungen:meldungen, unklar:unklar };
}

function start(){
  themaAnwenden(); einladungAusLink(); renderGate(); wire(); claudeDb(); PUSH.start();
  versionPruefen();

function claudeDb(){
  if(!sb){ setDiag("Supabase konnte nicht geladen werden. Internetverbindung prüfen.",true); return; }
  store=sbStore(); S.offline=false;
  sb.auth.getSession().then(function(r){
    var sess=r&&r.data&&r.data.session;
    connect();
    if(sess) nachAnmeldung(sess.user);
  });
  beobachten(sb);
}

// Nach erfolgreicher Anmeldung die eigene Personenzeile holen
function nachAnmeldung(user){
  sb.from("personen").select("*").eq("id",user.id).maybeSingle().then(function(r){
    if(r.error||!r.data){
      setDiag("Dieser Zugang ist noch keinem Kalender zugeordnet. Melde dich beim Admin.",true);
      return;
    }
    // Setter ohne Kalender wartet auf die Zusage seines Closers
    if(r.data.rolle==="setter" && !r.data.kalender_id){
      S.wartet={ id:user.id, name:r.data.name };
      return warteBildschirm();
    }
    return sb.from("kalender").select("*").then(function(k){
      KAL={}; KAL_ID={};
      (k.data||[]).forEach(function(x){ KAL[x.id]=x; KAL_ID[x.name]=x.id; });
      var m=personAusDb(r.data);
      m.benutzer=benutzerAus(user.email);
      S.me=m; S.wartet=null;
      stoppUhr();
      enterApp();
      if(store&&store.onTeam) setTimeout(function(){ render(); },500);
    });
  });
}

/* Zwischenschritt für Setter ohne Kalender:
   Closer wählen, auf die Zusage warten, oder es bei jemand anderem versuchen. */
var warteTimer=null;

function warteBildschirm(){
  $("app").hidden=true; $("untenleiste").hidden=true; $("gate").hidden=false;
  $("loginBox").hidden=true; $("neuBox").hidden=true;

  return Promise.all([
    sb.from("anfragen").select("*").eq("person_id",S.wartet.id).order("angelegt",{ascending:false}).limit(1),
    sb.rpc("kalender_liste")
  ]).then(function(res){
    var anfrage=((res[0].data)||[])[0] || null;
    var closer = (res[1].data)||[];
    var name={}; closer.forEach(function(c){ name[c.id]=c.name; });
    var stand = anfrage ? anfrage.status : "keine";
    if(stand==="zurueckgezogen") stand="keine";

    var alt=$("warteBox"); if(alt) alt.remove();
    var el=document.createElement("div"); el.id="warteBox";

    if(stand==="offen"){
      $("gateTitel").textContent="Fast fertig";
      $("gateText").textContent="Deine Anfrage ist unterwegs.";
      el.innerHTML='<div class="warnbox" style="margin-bottom:12px"><b>'+esc(name[anfrage.kalender_id]||"Dein Closer")+' muss noch zustimmen</b><br>'+
          'Sobald er annimmt, geht es hier von allein weiter. Ein kurzer Anruf beschleunigt das meistens.</div>'+
        '<button class="btn" id="w_weg" style="width:100%;margin-bottom:8px">Anfrage zurücknehmen</button>';
    } else {
      var abgelehnt = (stand==="abgelehnt");
      $("gateTitel").textContent = abgelehnt ? "Anfrage abgelehnt" : "Für wen setzt du Termine?";
      $("gateText").textContent = abgelehnt
        ? ((name[anfrage.kalender_id]||"Der Closer")+" hat die Anfrage nicht angenommen. Du kannst es bei jemand anderem versuchen.")
        : "Wähl den Closer, in dessen Kalender du Termine einträgst.";
      el.innerHTML = closer.length
        ? '<div class="field" style="margin-bottom:12px"><label for="w_closer">Closer</label>'+
            '<select id="w_closer"></select></div>'+
          '<button class="btn primary" id="w_neu" style="width:100%;margin-bottom:8px">Anfrage senden</button>'
        : '<div class="warnbox" style="margin-bottom:12px">Es gibt noch keinen Closer, dem du dich anschließen könntest. Melde dich bei dem, der dich geschickt hat.</div>';
    }
    el.innerHTML += '<button class="btn ghost" id="w_ab" style="width:100%">Abmelden</button>'+
                    '<p class="err" id="w_err" hidden style="margin-top:10px"></p>';
    document.querySelector(".gate-box").insertBefore(el, $("gateHint"));

    $("w_ab").onclick=function(){
      stoppUhr();
      sb.auth.signOut({scope:"local"}).then(function(){
        S.wartet=null;
        var w=$("warteBox"); if(w) w.remove();
        renderGate();
      });
    };

    var weg=$("w_weg");
    if(weg) weg.onclick=function(){
      weg.disabled=true;
      sb.from("anfragen").update({status:"zurueckgezogen"}).eq("id",anfrage.id).then(function(){
        warteBildschirm();
      }).catch(function(e){ weg.disabled=false; zeigFehler(e); });
    };

    var sel=$("w_closer");
    if(sel){
      var ausser = anfrage ? anfrage.kalender_id : null;
      var wahl = closer.filter(function(c){ return c.id!==ausser; });
      sel.innerHTML='<option value="">Bitte auswählen</option>'+
        wahl.map(function(c){ return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'; }).join("");
      $("w_neu").onclick=function(){
        var ziel=sel.value, b=$("w_neu");
        if(!ziel){ zeigFehler(new Error("Wähl einen Closer aus der Liste.")); return; }
        b.disabled=true;
        sb.from("anfragen").insert({ person_id:S.wartet.id, kalender_id:ziel }).then(function(r){
          if(r.error) throw r.error;
          warteBildschirm();
        }).catch(function(e){ b.disabled=false; zeigFehler(e); });
      };
    }

    starteUhr();
    setDiag("");

    function zeigFehler(e){
      var f=$("w_err"); if(!f) return;
      f.hidden=false; f.textContent=meldung(e);
    }
  });
}

function starteUhr(){
  if(warteTimer) return;
  warteTimer=setInterval(function(){
    if(!S.wartet){ stoppUhr(); return; }
    sb.from("personen").select("kalender_id").eq("id",S.wartet.id).maybeSingle().then(function(p){
      if(p.data && p.data.kalender_id){
        stoppUhr();
        var w=$("warteBox"); if(w) w.remove();
        sb.auth.getUser().then(function(u){
          nachAnmeldung((u.data&&u.data.user)||{ id:S.wartet.id });
        });
      }
    });
  },8000);
}
function stoppUhr(){ if(warteTimer){ clearInterval(warteTimer); warteTimer=null; } }

function connect(){
  S.ready=true;
  store.onTeam(function(list){
    S.team=sortTeam(list);
    if(S.me){
      var m=S.team.filter(function(x){ return x.id===S.me.id; })[0];
      if(m) S.me=m;
      else if(S.team.length){
        LS.del("sb_me"); S.me=null; closeOverlay();
        $("app").hidden=true; $("untenleiste").hidden=true; $("gate").hidden=false;
        toast("Du wurdest aus dem Team entfernt.");
      }
    }
    // Nur zeichnen, wenn sich am Team wirklich etwas geändert hat, sonst flackert das Panel
    var sig=S.team.map(function(m){ return m.id+":"+m.name+":"+m.rolle+":"+(m.benutzer||"")+":"+(m.gehoertZu||"")+":"+(m.startPlz||""); }).join("|");
    if(sig===S.teamSig) return;
    S.teamSig=sig;
    renderGate(); renderFilter(); render();
    if(!S.offline) setDiag("Verbunden. "+S.team.length+" im Team, "+S.appts.length+" Termine gespeichert.");
    if(document.querySelector('[data-overlay="who"]') && !document.querySelector(".confirm") && !S.neuerZugang) openWho();
  });
  if(store.onSperr) store.onSperr(function(list){ S.sperr=list; render(); });
  store.onAppts(function(list){
    S.appts=list.sort(function(a,b){ return startMs(a)-startMs(b); });
    render();
  });
  store.onActivity(function(list){
    var prev=S.activity.length;
    S.activity=list.sort(function(a,b){ return b.ts-a.ts; }).slice(0,60);
    if(!S.firstFeed && S.activity.length>prev && S.me){
      var top=sichtbareEvents()[0];
      if(top && top.by!==S.me.name && top.ts>Date.now()-60000) toast(top.by+": "+top.text);
    }
    S.firstFeed=false;
    renderBell(); renderSide();
    if(document.querySelector('[data-overlay="feed"]')) openFeed(true);
  });

  renderBanner();

  // Offene Anfragen regelmäßig prüfen, nur für Closer und Admin
  setInterval(function(){
    if(!S.me || (S.me.rolle!=="closer" && !istAdmin())) return;
    if(!store || !store.anfragenLaden) return;
    store.anfragenLaden().then(function(liste){
      var vorher=(S.anfragen||[]).length;
      S.anfragen=liste;
      if(liste.length!==vorher) renderBanner();
    });
  },20000);
}

function enterApp(){
  $("gate").hidden=true; $("app").hidden=false; $("untenleiste").hidden=false;
  S.view="home";
  if(S.me.rolle==="closer") S.filterCloser=S.me.name;
  $("whoName").textContent=S.me.name;
  $("whoRole").textContent=S.me.rolle==="closer"?"Closer":(S.me.rolle==="admin"?"Admin":"Setter");
  $("whoAv").textContent=initials(S.me.name);
  var c=meinCloser();
  renderFilter(); render(); renderBell(); renderBanner(); terminAusLink();
}

  var m=/#termin=([A-Za-z0-9-]+)/.exec(location.hash||"");

  history.replaceState(null,"",location.pathname+location.search);
  var id=m[1];
  setTimeout(function(){ if(S.appts.filter(function(a){ return a.id===id; })[0]) openAppt(id); },900);
}

        : '<b>Mitteilungen sind aus.</b> Damit du neue Termine sofort mitbekommst, unter <b>Zugänge</b> die Mitteilungen einschalten. '+
          '<button class="btn ghost" id="pushJetzt" style="padding:2px 8px">Jetzt einschalten</button>';

      if(!b.querySelector(".bannerZu")){

        zu.onclick=function(){ S.bannerZu=true; b.hidden=true; };

}

/* ---------------- Selbstanlage als Setter ---------------- */
var EINLADUNG = null;      // Code aus dem geteilten Link

function einladungAusLink(){
  var m=/[#?&]e=([A-Za-z0-9_-]{6,40})/.exec(location.hash||"") ||
        /[#?&]e=([A-Za-z0-9_-]{6,40})/.exec(location.search||"");
  if(!m) return;
  EINLADUNG=m[1];
  try{ history.replaceState(null,"",location.pathname); }catch(e){}

function zeigeNeu(an){
  $("loginBox").hidden=an;
  $("neuBox").hidden=!an;
  $("gateTitel").textContent = an ? "Setter registrieren" : "Anmelden";
  $("gateText").textContent = an
    ? "Leg dir einen Zugang an. Danach sagst du, für wen du Termine setzt."
    : "Melde dich mit deinem Benutzernamen und Passwort an.";
  if(an && EINLADUNG){
    $("nu_einladung").hidden=false;
    $("nu_einladung").innerHTML='<b>Du wurdest eingeladen.</b><br>Nach dem Anlegen bist du sofort im Kalender, ohne Warten.';
  }
}

function setterAnlegen(){
  var name=$("nu_name").value.trim();
  var u=benutzerNorm($("nu_user").value);
  var pw=$("nu_pw").value;
  var err=$("nu_err");
  err.hidden=true;
  if(!name) { err.hidden=false; err.textContent="Wie heißt du?"; return; }
  if(u.length<3){ err.hidden=false; err.textContent="Der Benutzername braucht mindestens drei Zeichen."; return; }
  if(pw.length<6){ err.hidden=false; err.textContent="Das Passwort braucht mindestens sechs Zeichen."; return; }

  var kb=$("lg_bleiben");
  bleibenSetzen(kb?kb.checked:true);
  clientWechseln(kb?kb.checked:true);

  $("nu_go").disabled=true;
  sb.auth.signUp({ email:mailVon(u), password:pw }).then(function(r){
    if(r.error) throw r.error;
    var id=r.data.user && r.data.user.id;
    if(!id) throw new Error("Der Zugang wurde nicht angelegt.");
    return sb.from("personen").insert({ id:id, name:name, rolle:"setter", kalender_id:null })
      .then(function(p2){
        if(p2.error) throw p2.error;
        if(EINLADUNG){
          return sb.rpc("einladung_einloesen",{ code_ein:EINLADUNG }).then(function(e){
            if(e.error) throw e.error;
            if(e.data!=="ok") throw new Error("Diese Einladung gilt nicht mehr ("+e.data+"). Frag deinen Closer nach einer neuen.");
            EINLADUNG=null;
          });
        }
      }).then(function(){ return id; });
  }).then(function(id){
    $("nu_go").disabled=false;
    $("nu_pw").value="";
    return sb.auth.getUser().then(function(u2){
      nachAnmeldung((u2.data&&u2.data.user)||{ id:id });
    });
  }).catch(function(e){
    $("nu_go").disabled=false;
    err.hidden=false; err.textContent=meldung(e);
  });
}

function renderGate(){
  if(S.wartet) return;                       // Setter wartet auf seinen Closer
  var kb=$("lg_bleiben"); if(kb) kb.checked=!FENSTER_MODUS;
  var neuOffen = $("neuBox") && !$("neuBox").hidden;
  if(!neuOffen){
    $("gateTitel").textContent = "Anmelden";
    $("gateText").textContent = "Melde dich mit deinem Benutzernamen und Passwort an.";
    $("loginBox").hidden = false;
  }
}

function anmelden(){
  var u=benutzerNorm($("lg_user").value), pw=$("lg_pw").value, err=$("lg_err");
  err.hidden=true;
  var kb=$("lg_bleiben"), willBleiben = kb ? kb.checked : true;
  bleibenSetzen(willBleiben);
  clientWechseln(willBleiben);
  if(!u||!pw){ err.hidden=false; err.textContent="Benutzername und Passwort eingeben."; return; }
  $("lg_go").disabled=true;
  sb.auth.signInWithPassword({ email:mailVon(u), password:pw }).then(function(r){
    $("lg_go").disabled=false;
    if(r.error){
      err.hidden=false;
      err.textContent = /Invalid/i.test(r.error.message||"")
        ? "Benutzername oder Passwort stimmt nicht."
        : r.error.message;
      return;
    }
    $("lg_pw").value="";
    nachAnmeldung(r.data.user);
  });
}

function renderFilter(){
  var box=$("closerFilter"); if(!box) return;
  if(S.filterCloser!=="alle"&&S.filterCloser!=="meine") S.filterCloser="alle";
  if(istAdmin()){
    var cs2=closers();
    box.innerHTML='<span class="lab">Kalender</span>'+
      '<button class="chip" data-k="" aria-pressed="'+(!S.adminKal)+'">Alle</button>'+
      cs2.map(function(c){ return '<button class="chip" data-k="'+esc(c.name)+'" aria-pressed="'+(S.adminKal===c.name)+'">'+esc(c.name)+'</button>'; }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".chip"),function(b){
      b.onclick=function(){ S.adminKal=b.dataset.k||null; renderFilter(); render(); };
    });
    return;
  }
  if(!S.me||S.me.rolle!=="setter"){ box.innerHTML=""; return; }
  box.innerHTML='<button class="chip" data-c="alle" aria-pressed="'+(S.filterCloser==="alle")+'">Alle Termine</button>'+
    '<button class="chip" data-c="meine" aria-pressed="'+(S.filterCloser==="meine")+'">Nur meine</button>';
  Array.prototype.forEach.call(box.querySelectorAll(".chip"),function(b){
    b.onclick=function(){ S.filterCloser=b.dataset.c; renderFilter(); render(); };
  });
}

function istAdmin(){ return !!(S.me&&S.me.rolle==="admin"); }
function meinCloser(){
  if(!S.me) return null;
  if(istAdmin()) return S.adminKal||null;
  return S.me.rolle==="closer" ? S.me.name : (S.me.gehoertZu||null);
}
function erlaubteTermine(){
  var c=meinCloser();
  if(istAdmin()&&!c) return S.appts.slice();
  if(!c) return [];
  return S.appts.filter(function(a){ return a.closer===c; });
}
function visible(){
  var me=S.me?S.me.name:"";
  return erlaubteTermine().filter(function(a){
    return S.filterCloser==="meine" ? a.setter===me : true;
  });
}

/* ---------------- render ---------------- */
function render(){
  if($("app").hidden) return;
  if(S.view!=="home" && S.view!=="week") S.view="week";   // es gibt nur noch diese beiden
  $("view-home").hidden=S.view!=="home";
  $("view-week").hidden=S.view!=="week";
  $("tab-home").setAttribute("aria-selected",String(S.view==="home"));
  $("tab-week").setAttribute("aria-selected",String(S.view==="week"));
  if(S.view==="home") renderHome();
  else { renderWeek(); renderSide(); }
}

  var filter=(S.closerSuche||"").toLowerCase();
  var sichtbar=cs.filter(function(c){ return !filter || c.name.toLowerCase().indexOf(filter)>-1; });

    '<p>Adminzugang. Du siehst alle Kalender, ihre Setter und Zugänge.</p></div>';

  html+=kalenderSuchfeld(cs.length);
  html+='<div class="kalreihe">'+(sichtbar.length?sichtbar.map(function(c){
    var t=S.appts.filter(function(a){ return a.closer===c.name&&a.status!=="abgesagt"; }).length;
    var setter=S.team.filter(function(m){ return m.rolle==="setter"&&m.gehoertZu===c.name; }).length;

  Array.prototype.forEach.call($("view-home").querySelectorAll("[data-go]"),function(b){
    b.onclick=function(){
      S.adminKal=null; S.view="week"; renderFilter(); render();
    };
